let renderTimer = null;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 90);
}
/* 3칸 금액이 칸 밖으로 넘치지 않게 폰트를 한 단계씩 줄여 맞춘다 */
function fitAmounts(root) {
  const els = (root || document).querySelectorAll('[data-fit]');
  els.forEach(el => {
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize) || 12.5;
    let size = base, guard = 0;
    while (size > 8 && el.scrollWidth > el.clientWidth + .5 && guard++ < 40) {
      size = Math.round((size - .5) * 100) / 100;
      el.style.fontSize = size + 'px';
    }
  });
}
/* 목표 카드 1·2·3번 '현재' 뱃지의 폭을 가장 넓은 뱃지에 맞춰 세로로 반듯하게 통일한다 */
function fitGoalBadges(root) {
  const pills = Array.from((root || document).querySelectorAll('.goalcard .nwpill'));
  if (pills.length < 2) return;
  pills.forEach(p => { p.style.minWidth = '0px'; });
  const widest = Math.max.apply(null, pills.map(p => p.getBoundingClientRect().width));
  if (!widest) return;
  const w = Math.ceil(widest) + 'px';
  pills.forEach(p => { p.style.minWidth = w; });
}
function render() {
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ST.tab));
  if (smG.active) { render.pending = true; return; }
  const view = $('#view');
  const keep = view.scrollTop;
  if (!ST.loaded) {
    view.innerHTML = '<div class="skeleton">불러오는 중…</div>';
    return;
  }
  /* 전략 탭만 위·아래 반반 고정 — 세은·찬규 보드는 한 화면 전체 스크롤 */
  view.classList.toggle('fix-half', ST.tab === 'strategy');
  if (ST.tab === 'networth') { view.innerHTML = netWorthView(); fitAmounts(view); }
  else if (ST.tab === 'strategy') { view.innerHTML = strategyView(); }
  else if (ST.tab === 'chankyu') { view.innerHTML = chankyuView(); fitGoalBadges(view); }
  else { view.innerHTML = visionView(); fitGoalBadges(view); }
  if (render.sameTab) view.scrollTop = keep;
  render.sameTab = true;
}
function go(tab) {
  if (ST.tab === tab) return;
  ST.tab = tab;
  render.sameTab = false;
  render();
  $('#view').scrollTop = 0;
  tabIntoView(tab);
}
function tabIntoView(tab) {
  const b = $('#tabs .tab[data-tab="' + (tab || ST.tab) + '"]');
  if (!b) return;
  try { b.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {}
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (b) go(b.dataset.tab);
});
/* 화면 폭이 바뀌면(회전 등) 3칸 금액·목표 뱃지 폭을 다시 맞춘다 */
let fitTimer = null;
function refitSoon() {
  if (fitTimer) clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    if (ST.tab === 'networth') fitAmounts($('#view'));
    else if (ST.tab === 'vision' || ST.tab === 'chankyu') fitGoalBadges($('#view'));
  }, 120);
}
window.addEventListener('resize', refitSoon);
window.addEventListener('orientationchange', refitSoon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitSoon);

/* ---------- 1. 비전보드 ---------- */
function vArr(v, key) { return v && Array.isArray(v[key]) ? v[key] : []; }
function tYear() { const t = ST.vision && ST.vision.target; return (t && t.year) ? String(t.year) : ''; }
function penBtn(act, label) {
  return '<button class="pen-btn" data-act="' + act + '" aria-label="' + esc(label) + '">✏️</button>';
}
function goalItems() {
  const g = ST.vision && ST.vision.goal;
  return (g && Array.isArray(g.items)) ? g.items : [];
}
function goalNote() {
  return goalItems().map(i => ((i.label ? i.label + ' ' : '') + (i.value || '')).trim())
    .filter(Boolean).join(' + ');
}
function freeGoals() {
  const t = (ST.vision && ST.vision.target && typeof ST.vision.target === 'object') ? ST.vision.target : {};
  let out;
  if (Array.isArray(t.goals)) out = t.goals.slice();
  else {
    out = [];
    if (t.plus) out.push({ value: String(t.plus), label: '', note: '' });
    if (t.cashflow) out.push({ value: '월 ' + fmtMan(t.cashflow), label: '월급 외 현금흐름', note: '' });
  }
  /* 화면에서만 보정: 방 데이터에 '세팅력 컨설턴트'가 아직 없으면 4번으로 붙인다.
     (방 데이터는 그대로 둔다 — 목표 시트에서 저장할 때만 함께 저장된다) */
  if (!out.some(g => String((g && g.value) || '').indexOf('세팅력') >= 0)) {
    out.push({ value: '세팅력 컨설턴트', label: '', note: '', now: '공부중' });
  }
  return out;
}
function nwBadge() {
  const nw = latestNw();
  if (!nw) return '<span class="nwpill none"><span class="k">현재 순자산</span><span class="v">기록 전</span></span>';
  const total = (num(nw.seeun) || 0) + (num(nw.chankyu) || 0) - (num(nw.expense) || 0);
  return '<span class="nwpill"><span class="k">현재</span><span class="v">' + esc(fmtMan(total)) + '</span></span>';
}
/* 2·3번 목표 오른쪽 '현재' 뱃지 값 — 방 데이터의 목표 항목에 now 값이 있으면 그것을,
   없으면 지금 적힌 목표(2번 1호기 · 3번 0원)에 맞춘 기본값을 쓴다. */
const GOAL_NOW_DEFAULT = ['1호기', '0원'];
function goalNowText(fg, i) {
  const v = fg && fg.now;
  if (v != null && String(v).trim()) return String(v).trim();
  return GOAL_NOW_DEFAULT[i] || '';
}
function nowBadge(text) {
  if (!text) return '';
  return '<span class="nwpill"><span class="k">현재</span><span class="v">' + esc(text) + '</span></span>';
}
function visionView() {
  const v = ST.vision;
  const target = targetMan();

  let hero;
  if (!v) {
    hero = '<section class="hero"><div class="hero-top"><span>🌼</span> BUBUDAISY</div>' +
      '<div class="hero-main">비전보드 데이터를 기다리고 있어요</div>' +
      '<div class="hero-sub">한 번만 준비되면 여기에 우리의 10년이 담겨요</div></section>';
  } else {
    const t = (v.target && typeof v.target === 'object') ? v.target : {};
    const topTxt = (t.year ? t.year + '년' : '') + (t.age ? (t.year ? ' · ' : '') + '만 ' + t.age + '세' : '');
    const rows = [];
    // 1번 목표: 순자산 30억 + 오른쪽에 현재 순자산 뱃지
    rows.push('<div class="grow ro"><span class="gn">1</span><span class="gt">' +
      '<span class="gv">' + (target ? '순자산 ' + esc(fmtMan(target)) : '순자산 목표 정하기') + '</span>' +
      '</span>' + nwBadge() + '</div>');
    freeGoals().forEach((fg, i) => {
      rows.push('<div class="grow ro"><span class="gn">' + (i + 2) + '</span><span class="gt">' +
        (fg.label ? '<span class="gl">' + esc(fg.label) + '</span>' : '') +
        '<span class="gv">' + esc(fg.value || '') + '</span>' +
        (fg.note ? '<span class="gsub">' + esc(fg.note) + '</span>' : '') +
        '</span>' + nowBadge(goalNowText(fg, i)) + '</div>');
    });
    hero = '<section class="hero goalcard">' +
      '<div class="hero-top goal-top"><span>' + esc(topTxt || '우리의 목표') + '</span></div>' +
      '<div class="grows">' + rows.join('') + '</div>' +
      '</section>';
  }

  let expertise = '';
  if (v) {
    const arr = expertiseItems();
    expertise = '<section class="card">' +
      '<div class="card-h"><h2>📚 세팅력 컨설턴트</h2><div class="board-tools">' +
        (arr.length ? '<span class="pill">' + arr.length + '개</span>' : '') + '</div></div>' +
      (arr.length ? '<div class="chips">' + arr.map((x) =>
        '<div class="chip"><span class="ci">' + esc(x.emoji || '•') + '</span>' + esc(x.label || '') + '</div>').join('') + '</div>' : '<p class="empty">아직 영역이 없어요</p>') +
      '</section>';
  }

  let ms = '';
  if (v) {
    const arr = vArr(v, 'milestones');
    ms = '<section class="card">' +
      '<div class="card-h"><h2 class="lng">💘 하나씩 천천히, 하지만 뾰족하게</h2><div class="board-tools">' +
        (arr.length ? '<span class="pill">' + esc(arr[0].year || '') + '~</span>' : '') + '</div></div>' +
      (arr.length ? '<div class="ms">' + arr.map((m, i) => {
        const its = (Array.isArray(m.items) ? m.items : []).slice(0, 3);
        const done = Array.isArray(m.done) ? m.done : [];
        /* 하위 메모 3칸 — 목표 칸 바로 아래 얇은 칸. 비어 있어도 자리를 지켜 3칸이 늘 보인다 */
        const subs = msSubArr(m);
        /* 하위 칸 완료 ✓ — 위 목표 칸의 done 과 별개 배열(헤더의 `1/3` 진행률에는 넣지 않는다) */
        const sdone = msSubDoneArr(m);
        /* 접힘 상태 키 — 연도를 쓰고, 연도가 비었을 때만 자리(i)를 쓴다 */
        const fk = msFoldKey(m, i);
        const fold = !!MS_FOLD[fk];
        const okN = its.filter((_, b) => done[b]).length;
        return '<div class="ms-card' + msToneCls(m.tone) + (fold ? ' fold' : '') + '">' +
          '<div class="ms-h" data-act="v-ms-fold" data-i="' + i + '" data-k="' + esc(fk) + '" role="button" tabindex="0" aria-expanded="' + (fold ? 'false' : 'true') + '" aria-label="' + esc(m.year || '') + ' 접기·펼치기">' +
          '<span class="y' + (m.tone === 'green' ? ' green' : '') + '">' + esc(m.year) + '</span>' +
          '<span class="ms-hr">' + (m.badge ? '<span class="bd">' + esc(m.badge) + '</span>' : '') +
          (its.length ? '<span class="ms-prog">' + okN + '/' + its.length + '</span>' : '') +
          '<button class="pen-btn ms-pen" data-act="v-ms" data-i="' + i + '" aria-label="' + esc(m.year || '') + ' 목표 수정">✏️</button>' +
          '<span class="ms-chev" aria-hidden="true"></span>' +
          '</span></div>' +
          '<div class="ms-grid">' + its.map((x, b) => '<button class="ms-box tap' + (done[b] ? ' done' : '') + '" data-act="v-ms-toggle" data-i="' + i + '" data-b="' + b + '" aria-pressed="' + (done[b] ? 'true' : 'false') + '">' + (done[b] ? '<span class="ck">✓</span>' : '') + esc(x) + '</button>').join('') +
          '<div class="ms-subgrid">' + subs.map((t, b) =>
            '<button class="ms-subbox tap' + (sdone[b] ? ' done' : '') + '" data-act="v-ms-sub" data-i="' + i + '" data-b="' + b + '" aria-pressed="' + (sdone[b] ? 'true' : 'false') + '" aria-label="' + esc(m.year || '') + ' ' + (b + 1) + '번 칸 하위 메모' + (sdone[b] ? ' · 완료' : '') + '">' +
            (sdone[b] ? '<span class="sk' + (t ? '' : ' only') + '" aria-hidden="true">✓</span>' : '') +
            (t ? '<span class="st">' + esc(t) + '</span>' : (sdone[b] ? '' : '<span class="ph">＋</span>')) + '</button>').join('') + '</div>' +
          '</div>' +
          '</div>';
      }).join('') + '</div>' : '<p class="empty">아직 연도 카드가 없어요</p>') +
      '<button class="add-row" data-act="v-ms" data-i="new">＋ 연도 추가</button>' +
      '</section>';
  }

  const flow = v ? flowSection() : '';
  /* 💸 현금흐름 — 올선등기 바로 아래, 세팅력 컨설턴트 위 */
  const cf = v ? cashflowCard() : '';

  /* 📚 세팅력 컨설턴트 바로 아래 — 8대 핵심 목표 (체크박스 대신 원형 숫자, 보기 전용) */
  let core = '';
  if (v) {
    const list = goalList();
    core = '<section class="card">' +
      '<div class="card-h"><h2>🎯 8대 핵심 목표</h2>' +
        (list.length ? '<span class="pill">' + list.length + '개</span>' : '') + '</div>' +
      (list.length ? '<ul class="goals">' + list.map((g, i) =>
        '<li class="goal' + (g.done ? ' done' : '') + '">' +
        '<span class="gnum">' + (i + 1) + '</span>' +
        '<span class="gtext">' + esc(g.text) +
          (g.memo ? '<span class="gmemo">📝 ' + esc(g.memo) + '</span>' : '') + '</span>' +
        '</li>').join('') + '</ul>' :
        '<p class="empty">목표 데이터를 기다리고 있어요</p>') +
      '</section>';
  }

  const foot = (v && v.footer) ? '<p class="foot-note">' + esc(v.footer) + '</p>' : '';
  return hero + flow + cf + expertise + core + ms + foot;
}

/* ---------- 🏠 올선등기 (구 갈아타기 · 비전 탭 · 편집 가능) ---------- */
function flowData() {
  const f = ST.vision && ST.vision.roadmapFlow;
  return (f && typeof f === 'object') ? f : null;
}
/* 2번째 '입주권(분양권)' 단계는 카드에서 뺐다(2026-11-17 요청).
   방 데이터는 그대로 두고 화면에서만 감춘 뒤, 남은 호기 배지를 1호기부터 다시 매긴다. */
function isDroppedFlowStep(s) {
  return String((s && s.label) || '').replace(/\s+/g, '').indexOf('입주권(분양권)') >= 0;
}
function flowSteps() {
  const f = flowData();
  const all = (f && Array.isArray(f.steps)) ? f.steps.filter(x => x && typeof x === 'object') : [];
  let n = 0;
  return all.filter(s => !isDroppedFlowStep(s)).map(s => {
    const badge = String(s.badge || '');
    if (/^\d+호기$/.test(badge)) { n += 1; return { ...s, badge: n + '호기' }; }
    return s;
  });
}
function flowWays() {
  const f = flowData();
  return (f && Array.isArray(f.ways)) ? f.ways.filter(x => x && typeof x === 'object') : [];
}
function flowSection() {
  const f = flowData();
  const head = '<div class="card-h"><h2>🏠 올림픽선수기자촌 등기</h2><div class="board-tools">' +
    (f ? penBtn('v-flow-meta', '올선등기 단계 수정') : '') + '</div></div>';
  if (!f) {
    return '<section class="card">' + head +
      '<p class="empty">아직 단계가 없어요<br>우리 집의 순서를 3단계로 적어 보세요</p>' +
      '<button class="add-row" data-act="v-flow-init">＋ 올선등기 단계 만들기</button>' +
      '</section>';
  }
  const steps = flowSteps();
  const grid = steps.length ? '<div class="flow4 c' + steps.length + '">' +
    steps.map((s, i) =>
      '<button class="flow-step' + (s.tone === 'accent' ? ' last' : '') + '" data-act="v-flow-step" data-i="' + i + '">' +
        '<span class="fs-badge">' + esc(s.badge || '단계') + '</span>' +
        '<span class="fs-emoji">' + esc(s.emoji || '•') + '</span>' +
        '<span class="fs-label">' + esc(s.label || '이름 없음') + '</span>' +
      '</button>').join('') + '</div>' : '';
  return '<section class="card">' + head + grid +
    '</section>';
}

/* ---------- 💸 현금흐름 6칸 (비전 탭 · 직접 입력) ----------
   세팅력 컨설턴트와 같은 3열×2행 그리드. 칸을 누르면 이모지와 이름을 적고
   Firebase(cashflowBoxes/b1~b6)에 바로 저장한다. 데이터가 없으면 빈칸으로 보인다. */
const CF_N = 6;
/* 메모 목록 접힘 상태 — 이 기기에만 저장한다. 기본값은 펼침이고, 방 데이터는 건드리지 않는다. */
const CF_FOLD_KEY = 'bubudaisy.cfNotesFold';
let CF_FOLD = loadCfFold();
function loadCfFold() {
  try { return localStorage.getItem(CF_FOLD_KEY) === 'fold'; } catch (e) { return false; }
}
function saveCfFold() {
  try { localStorage.setItem(CF_FOLD_KEY, CF_FOLD ? 'fold' : 'open'); } catch (e) {}
}
function cfToggleNotesFold(el) {
  const wrap = el && el.closest ? el.closest('.cf-wrap') : null;
  if (!wrap) return;
  const fold = !wrap.classList.contains('fold');
  wrap.classList.toggle('fold', fold);
  el.setAttribute('aria-expanded', fold ? 'false' : 'true');
  CF_FOLD = fold;
  saveCfFold();
}
function cfBox(i) {
  const d = (ST.cashflow && typeof ST.cashflow === 'object') ? ST.cashflow : {};
  const v = d['b' + (i + 1)];
  return (v && typeof v === 'object') ? v : {};
}
function cashflowCard() {
  const cells = [];
  const notes = [];
  for (let i = 0; i < CF_N; i++) {
    const b = cfBox(i);
    const label = String(b.label || '').trim();
    const emoji = String(b.emoji || '').trim();
    const empty = !label && !emoji;
    const note = String(b.note || '').trim();
    const name = label || ('항목 ' + (i + 1));
    cells.push('<button class="chip' + (empty ? ' empty' : '') + '" data-act="cf-edit" data-i="' + i +
      '" aria-label="현금흐름 ' + (i + 1) + '번 칸 수정' + (note ? ' (메모 있음)' : '') + '">' +
      (note ? '<span class="cf-note" aria-hidden="true">📝</span>' : '') +
      '<span class="ci">' + esc(emoji || '＋') + '</span>' +
      '<span class="cf-l">' + esc(name) + '</span></button>');
    if (note) notes.push({ i: i, emoji: emoji, name: name, note: note });
  }
  /* 6칸 아래 — 메모를 적은 칸만 b1~b6 순서로 모아 보여 주고, 줄을 누르면 그 칸 시트가 열린다.
     헤더 줄(📝 메모 n개 + ▾)을 누르면 목록만 접히고, 접힘 상태는 이 기기에 남는다. */
  const noteList = notes.length
    ? '<div class="cf-wrap' + (CF_FOLD ? ' fold' : '') + '">' +
        '<div class="cf-fold" data-act="cf-notes-fold" role="button" tabindex="0" aria-expanded="' + (CF_FOLD ? 'false' : 'true') + '" aria-label="현금흐름 메모 ' + notes.length + '개 접기·펼치기">' +
          '<span class="cf-ft">📝 메모 <span class="cf-fc">' + notes.length + '개</span></span>' +
          '<span class="cf-chev" aria-hidden="true"></span>' +
        '</div>' +
        '<div class="cf-notes" aria-label="현금흐름 메모">' + notes.map(n =>
        '<button class="cf-nl" data-act="cf-edit" data-i="' + n.i + '" aria-label="' + esc(n.name) + ' 메모 수정">' +
        '<span class="cf-nh">' + (n.emoji ? '<span class="cf-ne" aria-hidden="true">' + esc(n.emoji) + '</span>' : '') +
        esc(n.name) + '</span>' +
        '<span class="cf-nt">' + esc(n.note) + '</span></button>').join('') + '</div>' +
      '</div>'
    : '<p class="cap" style="text-align:left">칸을 누르면 이모지·이름·메모를 직접 적을 수 있어요</p>';
  return '<section class="card">' +
    '<div class="card-h"><h2>💸 현금흐름 월 1,000만원</h2><div class="board-tools"><span class="pill">' + CF_N + '개</span></div></div>' +
    '<div class="chips cf">' + cells.join('') + '</div>' +
    noteList +
    '</section>';
}
function openCfSheet(i) {
  const idx = Math.max(0, Math.min(CF_N - 1, Number(i) || 0));
  const cur = cfBox(idx);
  const has = !!(String(cur.label || '').trim() || String(cur.emoji || '').trim());
  const body =
    '<label class="fld"><span>아이콘 (이모지 한 글자)</span><input class="inp" id="cfEmoji" style="text-align:center;font-size:22px" maxlength="12" value="' + esc(cur.emoji || '') + '" placeholder="💵"></label>' +
    '<label class="fld"><span>이름</span><input class="inp" id="cfLabel" value="' + esc(cur.label || '') + '" placeholder="예: 월세 수입"></label>' +
    '<label class="fld"><span>메모 (선택)</span><textarea class="inp" id="cfNote" placeholder="예: 매달 25일 입금 · 200만원 / 관리비 별도">' + esc(cur.note || '') + '</textarea></label>' +
    '<p class="hint-in">💵 🏠 📈 처럼 짧은 이모지를 붙여 넣으면 돼요. 메모를 적어 두면 칸 오른쪽 위에 📝 가 붙어요. 이름과 아이콘을 모두 비우고 저장하면 빈칸으로 돌아가요.</p>';
  const acts = '<button class="sh-save" id="cfSave">저장</button>' +
    (has ? '<button class="sh-del" id="cfClear">비우기</button>' : '');
  openSheet('현금흐름 ' + (idx + 1) + '번 칸', body, acts);
  const prevBox = (ST.cashflow && ST.cashflow['b' + (idx + 1)]) ? { ...ST.cashflow['b' + (idx + 1)] } : null;
  async function clearBox() {
    if (ST.cashflow && ST.cashflow['b' + (idx + 1)]) delete ST.cashflow['b' + (idx + 1)];
    closeSheet(); render.sameTab = true; render();
    try { await del('cashflowBoxes/b' + (idx + 1)); toast('칸을 비웠어요'); }
    catch (e) {
      if (!ST.cashflow || typeof ST.cashflow !== 'object') ST.cashflow = {};
      if (prevBox) ST.cashflow['b' + (idx + 1)] = prevBox;
      render.sameTab = true; render(); toast('저장하지 못했어요');
    }
  }
  $('#cfSave').addEventListener('click', async () => {
    const emoji = $('#cfEmoji').value.trim();
    const label = $('#cfLabel').value.trim();
    const note = ($('#cfNote').value || '').trim();
    if (!label) {
      if (!emoji) return clearBox();
      toast('이름을 적어 주세요'); return;
    }
    const rec = { emoji: emoji || null, label: label, note: note || null, order: idx + 1, updatedAt: Date.now() };
    if (!ST.cashflow || typeof ST.cashflow !== 'object') ST.cashflow = {};
    ST.cashflow['b' + (idx + 1)] = rec;
    closeSheet(); render.sameTab = true; render();
    try { await put('cashflowBoxes/b' + (idx + 1), rec); toast('저장했어요'); }
    catch (e) {
      if (prevBox) ST.cashflow['b' + (idx + 1)] = prevBox;
      else delete ST.cashflow['b' + (idx + 1)];
      render.sameTab = true; render(); toast('저장하지 못했어요');
    }
  });

/* ---------- 3. 🧭 전략 탭 — 전략 · 마인드 (strategyMind) ----------
   부부 할일 앱과 같은 줄 모양: 이모지 + 제목 (+ 📝 메모는 있을 때만 아래 줄).

/* 아이콘은 그룹마다 고정 — 전략은 🍯, 마인드는 💛.
   방에 저장된 emoji 값과 상관없이 화면은 항상 이 아이콘으로 그린다(데이터는 건드리지 않는다). */
const SM_LISTS = [

  { key: 'mind', title: '💛 마인드', label: '마인드', emoji: '💛', empty: '아직 마인드가 없어요', ph: '예: 매일 아침 목표를 소리 내어 읽는다' },

     그 데이터(strategyMind/ck_affirm·ck_action)는 지우지 않고 그대로 둔다 */
  { key: 'ck_affirm', title: '🔮 확언', label: '확언', emoji: '🔮', empty: '아직 확언이 없어요', ph: '예: 나는 매달 현금흐름 1,000만원을 만든다' },
  { key: 'ck_action', title: '🎯 실행', label: '실행', emoji: '🎯', empty: '아직 실행이 없어요', ph: '예: 이번 주 안에 임장 3곳 다녀오기' }
];
const SM_STRATEGY_KEYS = ['strategy', 'mind'];
const SM_CHANKYU_KEYS = ['ck_affirm', 'ck_action'];
/* 처음 한 번만 깔아 두는 전략 예시 — 기존 tradeUpStrategies에 있던 2건. 바로 고치고 지울 수 있다. */
const SM_SEED = [
  { id: 's1', emoji: '🏦', text: '집주인근저당 + 이자 더 주고 이주할 때 이주비 대출로 갈아탄다' },
  { id: 's2', emoji: '🏠', text: '집주인근저당 + 2년 거주 후 세입자 들이고 전세금으로 반환한다' }
];
let smOpen = null;      /* 스와이프로 열린 줄 id */
let smTapBlock = false; /* 방금 제스처가 스와이프·드래그였는지 — 뒤따르는 click 을 막는다 */
let smSeeded = false;

function smData() {
  if (!ST.sm || typeof ST.sm !== 'object') ST.sm = {};
  return ST.sm;
}
function smList(key) {
  return entries(smData()[key]).map(([id, v]) => ({ id, ...v })).sort((a, b) => {
    const oa = num(a.order), ob = num(b.order);
    return ((oa === null ? 999 : oa) - (ob === null ? 999 : ob)) || a.id.localeCompare(b.id);
  });
}
/* 방에 전략·마인드가 아직 하나도 없으면 전략 예시 2건을 한 번만 넣는다.
   meta.seededAt 을 남겨, 세은 님이 두 건을 모두 지워도 다시 생기지 않게 한다. */
async function seedStrategyMind() {
  if (smSeeded) return;
  smSeeded = true;
  const now = Date.now();
  const strategy = {};
  SM_SEED.forEach((s, i) => {
    strategy[s.id] = { emoji: s.emoji, text: s.text, note: null, order: i, updatedAt: now };
  });
  const d = smData();
  d.strategy = { ...(d.strategy || {}), ...strategy };
  d.meta = { ...(d.meta || {}), seededAt: now };
  render.sameTab = true; render();
  try {
    /* 항목 단위로만 저장한다 — strategy 노드를 통째로 PATCH 하면 그 사이 다른 폰에서 들어온 항목을 지울 수 있다 */
    await Promise.all(entries(strategy).map(([id, rec]) => put('strategyMind/strategy/' + id, rec)));
    await patch('strategyMind/meta', { seededAt: now });
  }
  catch (e) {}
}
function smRow(l, it) {
  const id = esc(it.id);

/* ============================================================
   👨🏻 찬규 탭 — 세은(비전) 탭과 똑같은 6개 섬션 보드
   2026-11-19 세은 님 요청: "우리 찬규 비전을 아예 부부데이지에 동일한 구성으로 만들어주자"
   · 순서: 진남삭 목표 카드 → 등기 3칸 → 현금흐름 6칸+메모 → 태그 칩 → 핵심 목표 → 연도별
   · 제목·아이콘부터 줄 하나·칸 하나까지 전부 이 화면에서 고칠 수 있다
   · 데이터는 rooms/{room}/chankyuVision 하나에만 쓴다(세은 님 vision·cashflowBoxes 등은 절대 안 건드린다)
   ============================================================ */
const CK_NODE = 'chankyuVision';
const CK_FOLD_KEY = 'bubudaisy.ckFold';
let CK_FOLD = loadCkFold();
let ckSeeded = false;

function loadCkFold() {
  try {
    const o = JSON.parse(localStorage.getItem(CK_FOLD_KEY) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function saveCkFold() {
  try { localStorage.setItem(CK_FOLD_KEY, JSON.stringify(CK_FOLD)); } catch (e) {}
}
/* 방에 이미 들어있는 내용이 하나라도 있는지 — 있으면 기본 틀을 절대 덮어쓰지 않는다 */
function ckHasContent(d) {
  if (!d || typeof d !== 'object') return false;
  return Object.keys(d).some(k => {
    if (k === 'meta') return false;
    const v = d[k];
    return v && typeof v === 'object' && Object.keys(v).length > 0;
  });
}
function ckData() { return (ST.ck && typeof ST.ck === 'object') ? ST.ck : {}; }
function ckSec(key) {
  const s = ckData()[key];
  return (s && typeof s === 'object') ? s : {};
}
/* 객체로 저장된 줄·칸들을 order 순서로 — 연도/칸을 지우고 넣어도 번호가 밀리지 않는다 */
function ckList(obj) {
  return entries(obj).map(([id, v]) => ({ id, ...v })).sort((a, b) => {
    const oa = num(a.order), ob = num(b.order);
    return ((oa === null ? 999 : oa) - (ob === null ? 999 : ob)) || String(a.id).localeCompare(String(b.id));
  });
}
function ckNextOrder(obj) {
  let max = -1;
  entries(obj).forEach(([, v]) => { const n = num(v && v.order); if (n !== null && n > max) max = n; });
  return max + 1;
}
/* 3칸 배열 — Firebase 가 `{"1":"…"}` 처럼 숫자 키 객체로 돌려줘도 3칸으로 읽는다 */
function ck3(raw) {
  if (Array.isArray(raw)) return [0, 1, 2].map(i => raw[i]);
  if (raw && typeof raw === 'object') return [0, 1, 2].map(i => raw[i]);
  return [0, 1, 2].map(() => undefined);
}
/* 세은 님의 수치는 복제하지 않는다 — 2026-11-19 세은 님 지시로
   예시 문구·카드 제목을 모두 빼고, 찬규 님이 직접 적을 수 있는 빈 틀만 만든다. */
function ckTemplate(now) {
  const t = now || Date.now();
  return {
    meta: { seededAt: t, updatedAt: t, template: 'v2-empty' },
    hero: { title: '', goals: {}, updatedAt: t },
    flow: { title: '', emoji: '', steps: {}, updatedAt: t },
    cash: { title: '', emoji: '', cells: {}, updatedAt: t },
    chips: { title: '', emoji: '', items: {}, updatedAt: t },
    core: { title: '', emoji: '', items: {}, updatedAt: t },
    years: { title: '', emoji: '', cards: {}, updatedAt: t }
  };
}
async function seedChankyuVision() {
  if (ckSeeded) return;
  ckSeeded = true;
  const tpl = ckTemplate(Date.now());
  ST.ck = tpl;
  render.sameTab = true; render();
  try { await put(CK_NODE, tpl); } catch (e) {}
}

/* ---------- 저장 도우미 ---------- */
async function ckSaveSection(key, next, msg) {
  const prev = ST.ck;
  ST.ck = { ...(ST.ck || {}), [key]: next };
  closeSheet();
  render.sameTab = true; render();
  try { await put(CK_NODE + '/' + key, next); toast(msg); }
  catch (e) { ST.ck = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); }
}

async function ckToggleYearDone(id, b) {
  const s = ckSec('years');
  const cards = (s.cards && typeof s.cards === 'object') ? { ...s.cards } : {};
  const c = cards[id]; if (!c) return;
  const k = Number(b); if (!(k >= 0 && k <= 2)) return;
  const done = ck3(c.done).map(v => !!v);

  const rec = { ...c, done: done };
  const prev = ST.ck;
  cards[id] = rec;
  ST.ck = { ...(ST.ck || {}), years: { ...s, cards: cards, updatedAt: Date.now() } };
  render.sameTab = true; render();
  try { await put(CK_NODE + '/years/cards/' + id, rec); toast(done[k] ? '성공으로 표시했어요 ✨' : '다시 도전 중으로 돌렸어요'); }
  catch (e) { ST.ck = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); }
}
async function ckSetYearSub(id, b, text, doneVal) {
  const s = ckSec('years');
  const cards = (s.cards && typeof s.cards === 'object') ? { ...s.cards } : {};
  const c = cards[id]; if (!c) return null;
  const k = Math.max(0, Math.min(2, Number(b) || 0));
  const subs = ck3(c.subs).map(v => String(v == null ? '' : v));
  const sdone = ck3(c.subDone).map(v => !!v);
  if (text !== null) subs[k] = text;
  if (doneVal !== null) sdone[k] = !!doneVal;
  const rec = { ...c, subs: subs, subDone: sdone };
  const prev = ST.ck;
  cards[id] = rec;
  ST.ck = { ...(ST.ck || {}), years: { ...s, cards: cards, updatedAt: Date.now() } };
  render.sameTab = true; render();
  try { await put(CK_NODE + '/years/cards/' + id, rec); return true; }
  catch (e) { ST.ck = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); return false; }
}

/* ---------- 전략 줄 제스처: 한 번 탭 / 왼쪽 스와이프 / 길게 눌러 끌기 ----------
   손가락은 touch 로 직접 받아야 안드로이드 크롬이 스크롤·뒤로가기 제스처로 가져가지 않는다. */
const SM_LONG_PRESS = 320;
const SM_DELW = 84;
const smG = { on: false, src: null, pid: null, id: null, row: null, list: null, face: null,
  rowW: 0, actsW: SM_DELW, wasOpen: false, startX: 0, startY: 0, grab: 0,
  active: false, moved: false, swipe: false, base: 0, off: 0, timer: null, lastY: 0 };

function smRowEl(t) { return (t && t.closest) ? t.closest('.srow') : null; }
function smCloseSwipe(row) {
  if (!row) return;
  const face = row.querySelector('.srow-face');
  if (face) { row.classList.remove('swiping'); face.style.width = ''; }
  row.classList.remove('open');
  if (row.dataset.id === smOpen) smOpen = null;
}
function smCloseAll(except) {
  $$('#view .srow.open, #view .srow.swiping').forEach(r => { if (r !== except) smCloseSwipe(r); });
  if (!except) smOpen = null;
}
function smStart(x, y, target, src) {
  if (smG.on) return;
  const row = smRowEl(target);
  if (!row) return;
  if (target.closest('.srow-acts') || target.closest('.card-add')) return;
  const face = row.querySelector('.srow-face');
  const acts = row.querySelector('.srow-acts');
  const rect = row.getBoundingClientRect();
  smG.on = true; smG.src = src; smG.pid = null; smG.id = row.dataset.id;
  smG.row = row; smG.list = row.parentElement; smG.face = face;
  smG.rowW = rect.width;
  smG.actsW = acts ? (acts.getBoundingClientRect().width || SM_DELW) : SM_DELW;
  smG.wasOpen = row.classList.contains('open');
  smG.startX = x; smG.startY = y; smG.grab = y - rect.top;
  smG.active = false; smG.moved = false; smG.swipe = false; smG.off = 0; smG.lastY = y;
  if (src === 'touch') {
    smG.timer = setTimeout(() => { if (smG.on && !smG.active && !smG.swipe && !smG.moved) smBeginDrag(); }, SM_LONG_PRESS);
  }
}
function smBlockScroll(e) { if (smG.active) e.preventDefault(); }
function smBeginDrag() {
  if (!smG.on || smG.active) return;
  clearTimeout(smG.timer); smG.timer = null;
  if (smG.wasOpen) { smCloseSwipe(smG.row); smG.wasOpen = false; }
  smG.active = true;
  if (smG.row) smG.row.classList.add('dragging');
  document.body.classList.add('sm-dragging');
  window.addEventListener('touchmove', smBlockScroll, { passive: false });
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  smPaint(smG.lastY);
}
function smPaint(y) {
  const d = smG;
  if (!d.row || !d.list) return;
  const listTop = d.list.getBoundingClientRect().top;
  const dy = y - d.grab - (listTop - d.list.scrollTop + d.row.offsetTop);
  d.row.style.transform = 'translateY(' + dy + 'px) scale(1.01)';
}
function smMove(x, y, ev) {
  const d = smG; if (!d.on) return;
  const dx = x - d.startX, dy = y - d.startY;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  d.lastY = y;
  if (d.timer && adx > 6) { clearTimeout(d.timer); d.timer = null; }
  /* 길게 잡은 뒤라도 옆으로 밀면 스와이프로 바꾼다 */
  if (d.active && !d.moved && adx > 16 && adx > ady * 1.5) {
    d.active = false;
    if (d.row) { d.row.classList.remove('dragging'); d.row.style.transform = ''; }
    document.body.classList.remove('sm-dragging');
    window.removeEventListener('touchmove', smBlockScroll);
  }
  if (!d.active && !d.swipe) {
    if (adx > 10 && adx > ady * 1.4) {
      clearTimeout(d.timer); d.timer = null;
      d.swipe = true; d.moved = true; smTapBlock = true;
      d.base = d.wasOpen ? -d.actsW : 0;
      d.startX = x; d.startY = y; d.off = d.base;
      d.row.classList.add('swiping');
      smCloseAll(d.row);
      if (ev && ev.cancelable) ev.preventDefault();
    } else if (ady > 8) {
      if (d.src === 'touch') { smEnd(false); return; }   /* 손가락이 먼저 위아래 → 스크롤에 맡긴다 */
      smBeginDrag();
    } else return;
  }
  if (d.swipe) {
    if (ev && ev.cancelable) ev.preventDefault();
    const nx = Math.max(-d.actsW, Math.min(0, d.base + (x - d.startX)));
    d.off = nx;
    if (d.face) d.face.style.width = Math.round(d.rowW - Math.abs(nx)) + 'px';
    return;
  }
  d.moved = true; smTapBlock = true;
  const others = Array.from(d.list.querySelectorAll('.srow')).filter(r => r !== d.row);
  let before = null;
  for (const r of others) {
    const rc = r.getBoundingClientRect();
    if (y < rc.top + rc.height / 2) { before = r; break; }
  }
  if (before !== d.row.nextElementSibling) d.list.insertBefore(d.row, before);
  smPaint(y);
}
function smUp() {
  const d = smG; if (!d.on) return;
  if (d.timer) { clearTimeout(d.timer); d.timer = null; }
  if (d.swipe) {
    const open = d.off < -d.actsW * 0.4;
    d.row.classList.remove('swiping');
    if (d.face) d.face.style.width = '';
    d.row.classList.toggle('open', open);
    smOpen = open ? d.id : null;
    smG.on = false;
    if (open && navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
    return;
  }
  const tapped = !d.active && !d.moved;
  const wasOpen = d.wasOpen;
  const row = d.row;
  smEnd(true);
  if (tapped && wasOpen) { smCloseSwipe(row); smTapBlock = true; }
}
function smEnd(commit) {
  const d = smG; if (!d.on) return;
  if (d.timer) { clearTimeout(d.timer); d.timer = null; }
  window.removeEventListener('touchmove', smBlockScroll);
  const wasActive = d.active, moved = d.moved, list = d.list;
  smG.on = false; smG.active = false; smG.swipe = false;
  if (d.row) { d.row.classList.remove('dragging'); d.row.style.transform = ''; }
  document.body.classList.remove('sm-dragging');
  if (wasActive && moved && commit && list) smSaveOrder(list);
  else if (render.pending) { render.pending = false; render(); }
}
function smCancel() {
  const d = smG; if (!d.on) return;
  if (d.timer) { clearTimeout(d.timer); d.timer = null; }
  if (d.swipe) {
    d.row.classList.remove('swiping');
    if (d.face) d.face.style.width = '';
    d.row.classList.toggle('open', d.wasOpen);
    smOpen = d.wasOpen ? d.id : null;
    smG.on = false;
    return;
  }
  smEnd(false);
}
/* 마우스·펜 */
function smOnDown(e) {
  smTapBlock = false;
  if (e.pointerType === 'touch') return;
  if (e.button !== undefined && e.button > 0) return;
  smStart(e.clientX, e.clientY, e.target, 'mouse');
  if (smG.on) smG.pid = e.pointerId;
}
function smOnMove(e) {
  if (!smG.on || smG.src !== 'mouse' || e.pointerId !== smG.pid) return;
  smMove(e.clientX, e.clientY, e);
}
function smOnUp(e) {
  if (!smG.on || smG.src !== 'mouse') return;
  if (e && e.pointerId != null && e.pointerId !== smG.pid) return;
  smUp();
}
function smOnCancel() { if (smG.on && smG.src === 'mouse') smCancel(); }
/* 손가락 */
function smOnTouchStart(e) {
  if (!e.touches || e.touches.length !== 1) { if (smG.on && smG.src === 'touch') smCancel(); return; }
  smTapBlock = false;
  const t = e.touches[0];
  smStart(t.clientX, t.clientY, e.target, 'touch');
}
function smOnTouchMove(e) {
  if (!smG.on || smG.src !== 'touch') return;
  const t = e.touches && e.touches[0]; if (!t) return;
  smMove(t.clientX, t.clientY, e);
}
function smOnTouchEnd(e) {
  if (!smG.on || smG.src !== 'touch') return;
  if (e.touches && e.touches.length > 0) return;
  smUp();
}
function smOnTouchCancel() { if (smG.on && smG.src === 'touch') smCancel(); }

async function smSaveOrder(listEl) {
  const key = listEl.dataset.list;
  const ids = Array.from(listEl.querySelectorAll('.srow')).map(r => r.dataset.id);
  const data = smData()[key] || {};
  /* 항목 단위 PATCH 로만 저장한다. strategyMind/{key} 처럼 위 노드에 {id:{order}} 를 PATCH 하면
     Firebase 가 id 아래 객체 전체를 {order} 로 갈아 버려 text·emoji·note 가 지워진다. */
  const jobs = [], prev = {};
  ids.forEach((id, i) => {
    const cur = data[id];
    if (!cur) return;
    if (num(cur.order) === i) return;
    prev[id] = {
      has: Object.prototype.hasOwnProperty.call(cur, 'order'), order: cur.order,
      hasAt: Object.prototype.hasOwnProperty.call(cur, 'updatedAt'), updatedAt: cur.updatedAt
    };
    cur.order = i;
    cur.updatedAt = Date.now();
    jobs.push(patch('strategyMind/' + key + '/' + id, { order: i, updatedAt: cur.updatedAt }));
  });
  render.sameTab = true; render();
  if (!jobs.length) return;
  try { await Promise.all(jobs); toast('순서를 저장했어요'); }
  catch (e) {
    Object.entries(prev).forEach(([id, p]) => {
      const cur = data[id];
      if (!cur) return;
      if (p.has) cur.order = p.order; else delete cur.order;
      if (p.hasAt) cur.updatedAt = p.updatedAt; else delete cur.updatedAt;
    });
    render.sameTab = true; render();
    toast('순서를 저장하지 못했어요');
  }
}
async function smDel(key, id) {
  const data = smData()[key] || {};
  const prev = data[id] ? { ...data[id] } : null;
  if (!prev) return;
  delete data[id];
  smOpen = null;
  render.sameTab = true; render();
  try { await del('strategyMind/' + key + '/' + id); toast('삭제했어요'); }
  catch (e) {
    data[id] = prev;
    render.sameTab = true; render();
    toast('삭제하지 못했어요');
  }
}
/* 한 번 탭 → 제목·이모지·메모 수정 시트 */
function openSmSheet(key, id) {
  const l = SM_LISTS.find(x => x.key === key) || SM_LISTS[0];
  const isNew = !id;
  const cur = isNew ? { emoji: '', text: '', note: '' } : ((smData()[l.key] || {})[id] || {});
  draft.sm = { key: l.key, id: isNew ? null : id, base: { ...cur } };
  const body =
    '<label class="fld"><span>' + l.label + ' 제목</span><textarea class="inp" id="smText" style="min-height:76px" placeholder="' + esc(l.ph) + '">' + esc(cur.text || '') + '</textarea></label>' +
    '<label class="fld"><span>메모 (선택)</span><textarea class="inp" id="smNote" placeholder="조건·시기·확인할 것">' + esc(cur.note || '') + '</textarea></label>' +
    '<p class="hint-in">메모는 제목 아래 📝 줄로 보여요. 줄을 왼쪽으로 밀면 삭제 버튼이 나와요.</p>';
  const acts = '<button class="sh-save" id="smSave">' + (isNew ? '추가' : '저장') + '</button>' +
    (isNew ? '' : '<button class="sh-del" id="smDelBtn">삭제</button>');
  openSheet(isNew ? l.label + ' 추가' : l.label + ' 수정', body, acts);
  $('#smSave').addEventListener('click', async () => {
    const text = $('#smText').value.trim();
    if (!text) { toast('제목을 적어 주세요'); return; }
    /* 아이콘은 카드 그룹 아이콘(🍯 · 💛)으로 고정 — 기존 줄을 고칠 때는 저장돼 있던 값을 그대로 둔다 */
    const emoji = isNew ? l.emoji : ((cur && cur.emoji) ? cur.emoji : l.emoji);
    const note = $('#smNote').value.trim();
    const data = smData();
    if (!data[l.key] || typeof data[l.key] !== 'object') data[l.key] = {};
    const key2 = isNew ? newKey('sm') : draft.sm.id;
    let order = num(draft.sm.base.order);
    if (order === null) {
      let max = -1;
      smList(l.key).forEach(x => { const n = num(x.order); if (n !== null && n > max) max = n; });
      order = max + 1;
    }
    const rec = { emoji: emoji, text: text, note: note || null, order: order, updatedAt: Date.now() };
    const prevAll = { ...(data[l.key] || {}) };
    data[l.key][key2] = rec;
    closeSheet(); render.sameTab = true; render();
    try { await put('strategyMind/' + l.key + '/' + key2, rec); toast(isNew ? l.label + '을 추가했어요' : '저장했어요'); }
    catch (e) { data[l.key] = prevAll; render.sameTab = true; render(); toast('저장하지 못했어요'); }
  });
  if (!isNew) $('#smDelBtn').addEventListener('click', async (e) => {
    if (!delArm(e.currentTarget)) return;
    const key2 = draft.sm.id;
    closeSheet();
    await smDel(l.key, key2);
  });
}

function tradeList() {
  return entries(ST.tradeUp).map(([id, v]) => ({ id, ...v })).sort((a, b) => {
    const da = String(a.date || ''), db = String(b.date || '');
    if (da !== db) return da < db ? 1 : -1;
    const oa = num(a.order), ob = num(b.order);
    return (oa === null ? 999 : oa) - (ob === null ? 999 : ob) || a.id.localeCompare(b.id);
  });
}
function tradeView() {

/* ============================================================
   시트
   ============================================================ */
function openSheet(title, bodyHtml, actsHtml) {
  $('#shTitle').textContent = title;
  $('#shBody').innerHTML = bodyHtml;
  $('#shActs').innerHTML = actsHtml;
  $('#scrim').classList.add('on');
  $('#sheet').classList.add('on');
  $('#sheet').setAttribute('aria-hidden', 'false');
  pushSheetHistory();
}
function closeSheet(fromPop) {
  const wasOpen = $('#sheet').classList.contains('on');
  $('#scrim').classList.remove('on');
  $('#sheet').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden', 'true');
  // 시트를 위해 쌓아 둔 히스토리를 정리한다(이미 뒤로가기로 닫힌 경우는 건너뜀)
  if (wasOpen && sheetHistPushed) {
    sheetHistPushed = false;
    if (fromPop !== true && history.state && history.state.bdModal) {
      try { history.back(); } catch (e) {}
    }
  }
}
/* 안드로이드 뒤로가기: 시트가 열려 있으면 앱을 나가지 않고 시트만 닫는다 */
let sheetHistPushed = false;
function pushSheetHistory() {
  if (sheetHistPushed) return;
  try { history.pushState({ bdModal: true }, ''); sheetHistPushed = true; } catch (e) {}
}
window.addEventListener('popstate', () => {
  if ($('#sheet').classList.contains('on')) {
    sheetHistPushed = false; /* 엔트리는 방금 소비됐다 */
    closeSheet(true);
  }
});
$('#scrim').addEventListener('click', closeSheet);
$('#shX').addEventListener('click', closeSheet);

/* ---------- 순자산 입력 시트 ---------- */
function nwUnitsInit(man) {
  const u = { seeun: 'man', chankyu: 'man' };
  return u;
}
function fromMan(man, unit) {
  if (man === null || man === undefined || man === '') return '';
  const v = unit === 'eok' ? man / 10000 : man;
  return String(Math.round(v * 10000) / 10000);
}
function toMan(val, unit) {
  const n = Number(val);
  if (!Number.isFinite(n)) return null;
  return unit === 'eok' ? Math.round(n * 10000) : Math.round(n);
}
function openNwSheet(month) {

        '<option value="' + y + '"' + (String(y) === curY ? ' selected' : '') + '>' + y + '년</option>').join('') + '</select><i>▾</i></span>' +
      '<span class="sel"><select class="inp" id="nwMon">' + Array.from({ length: 12 }, (_, i) => i + 1).map(m =>
        '<option value="' + String(m).padStart(2, '0') + '"' +

    '</div></div>' +
    '<div class="fld"><span>세은 순자산</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwSeeun" placeholder="0" value="' + esc(fromMan(d.seeun, 'man')) + '">' +
      '<div class="unit-seg" data-who="seeun"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +

      '<input class="inp" type="number" inputmode="decimal" id="nwChankyu" placeholder="0" value="' + esc(fromMan(d.chankyu, 'man')) + '">' +
      '<div class="unit-seg" data-who="chankyu"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="fld"><span>부부 총비용</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwCost" placeholder="0" value="' + esc(fromMan(d.expense, 'man')) + '">' +
      '<div class="unit-seg" data-who="expense"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +

    const net = gross - (e === null ? 0 : e);
    $('#nwNet').textContent = (s === null && c === null && e === null) ? '—' : fmtMan(net);

/* ============================================================
   비전 탭 직접 편집 시트
   ============================================================ */
function intOrNull(s) {
  const t = String(s == null ? '' : s).trim();
  if (!t) return null;
  const n = Number(t.replace(/[^0-9.-]/g, ''));
  return Number.isFinite(n) ? Math.round(n) : null;
}
function delArm(btn) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1';
  btn.classList.add('confirm');
  btn.textContent = '정말 삭제할까요?';
  return false;
}
async function saveVisionKey(key, val, okMsg) {
  const prev = ST.vision;
  const next = { ...(prev || {}) };
  if (val === null) delete next[key]; else next[key] = val;
  ST.vision = next;
  closeSheet();
  render.sameTab = true; render();
  try { await put('vision/' + key, val); toast(okMsg); }
  catch (e) { ST.vision = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); }
}

/* ---------- 전문성 영역 ---------- */
/* 화면에 보이는 전문성 영역 — 방 데이터(rooms/…)는 건드리지 않고
   화면에서만 최신 구성으로 맞춘다: 재개발·재건축은 🏗️ 재재 한 칸으로 묶고,
   마지막 칸에 📜 정책을 붙인다(이미 있으면 중복해서 붙이지 않는다). */
const EXP_EMOJI_MERGE = '🏗️';
function expertiseItems() {
  const raw = vArr(ST.vision, 'expertise').filter(x => x && (x.label || x.emoji));
  const out = [];
  let merged = false;
  raw.forEach(x => {
    const label = String(x.label || '').trim();
    if (!label) return;
    if (/재재|재개발|재건축/.test(label)) {
      if (!merged) {
        out.push({ emoji: EXP_EMOJI_MERGE, label: '재재' });
        merged = true;
      }
      return;
    }
    if (/정책/.test(label)) return; /* 정책은 항상 마지막 칸으로 내려 붙인다 */
    out.push({ emoji: x.emoji, label: label });
  });
  if (!out.length) return out;
  out.push({ emoji: '📜', label: '정책' });
  return out;
}
function openVisionExpertiseSheet(i) {

/* ---------- 연도별 TOP3 목표 ---------- */
/* 칸을 누르면 그 항목만 성공(달성) 토글 — 방 데이터의 milestones/{i}/done 배열만 PATCH하고
   연도·배지·항목 텍스트는 건드리지 않는다. */
async function toggleMsDone(i, b) {
  const arr = vArr(ST.vision, 'milestones');
  const m = arr[Number(i)];
  const k = Number(b);
  if (!m || !(k >= 0)) return;
  const prevDone = Array.isArray(m.done) ? m.done.slice() : [];
  const done = prevDone.slice();
  done[k] = !done[k];
  m.done = done;
  render.sameTab = true; render();
  try {
    await put('vision/milestones/' + Number(i) + '/done', done);
    toast(done[k] ? '성공으로 표시했어요 ✨' : '다시 도전 중으로 돌렸어요');
  } catch (e) {
    m.done = prevDone;
    render.sameTab = true; render();
    toast('저장하지 못했어요');
  }
}
function msLead(y) {
  const m = /\d{4}/.exec(String(y == null ? '' : y));
  return m ? Number(m[0]) : 9999;
}
/* 하위 메모 3칸 — `vision/milestones/{i}/subItems` 의 3칸 배열을 항상 길이 3 으로 맞춰 읽는다.
   Firebase RTDB 는 칸 하나만 PUT 하면 `{"1":"..."}` 처럼 **객체**로 돌려줄 수 있어서
   배열과 숫자 키 객체 둘 다 받는다(안 받으면 한 칸만 저장한 뒤 새로 고침에 글자가 사라진다) */
function ms3(raw) {
  if (Array.isArray(raw)) return [0, 1, 2].map(b => raw[b]);
  if (raw && typeof raw === 'object') return [0, 1, 2].map(b => raw[b]);
  return [0, 1, 2].map(() => undefined);
}
function msSubArr(m) {
  return ms3(m && m.subItems).map(v => String(v == null ? '' : v));
}
/* 하위 얇은 칸 완료 ✓ — `vision/milestones/{i}/subDone` 의 3칸 불리언 배열.
   위 목표 칸의 `done` 과는 완전히 따로 둔다(헤더 `1/3` 진행률은 목표 3칸만 센다) */
function msSubDoneArr(m) {
  return ms3(m && m.subDone).map(v => !!v);
}
/* 하위 칸 완료 하나만 저장 — 잎 경로 `subDone/{b}` 만 PUT */
async function setMsSubDone(i, b, val) {
  const arr = vArr(ST.vision, 'milestones');
  const idx = Number(i), k = Math.max(0, Math.min(2, Number(b) || 0));
  const m = arr[idx];
  if (!m) return null;
  const before = msSubDoneArr(m);
  const next = before.slice();
  next[k] = !!val;
  m.subDone = next;
  render.sameTab = true; render();
  try {
    await put('vision/milestones/' + idx + '/subDone/' + k, next[k]);
    toast(next[k] ? '하위 칸을 완료로 칠했어요 ✓' : '하위 칸 완료를 풀었어요');
    return next[k];
  } catch (e) {
    m.subDone = before;
    render.sameTab = true; render();
    toast('저장하지 못했어요');
    return null;
  }
}
/* 얇은 칸 하나만 저장 — 카드 전체를 덮어쓰지 않고 잎 경로 `subItems/{b}` 만 PUT 해서
   같은 카드의 목표 3칸·성공 ✓·다른 하위 칸은 그대로 둔다 */
async function saveMsSub(i, b, text) {
  const arr = vArr(ST.vision, 'milestones');
  const idx = Number(i), k = Math.max(0, Math.min(2, Number(b) || 0));
  const m = arr[idx];
  if (!m) return;
  const before = msSubArr(m);
  const next = before.slice(); next[k] = text;
  m.subItems = next;
  closeSheet();
  render.sameTab = true; render();
  try {
    await put('vision/milestones/' + idx + '/subItems/' + k, text);
    toast(text ? '하위 메모를 저장했어요' : '하위 메모를 비웠어요');
  } catch (e) {
    m.subItems = before; render.sameTab = true; render(); toast('저장하지 못했어요');
  }
}

/* 연도 카드 저장 — 목록(`vision/milestones`) 전체를 덮어쓰지 않고 카드 단위 경로
   (`vision/milestones/{i}`)로만 PUT 한다. 카드 단위로 쓰면 나머지 연도의 `done`(성공 ✓)이
   통째로 지워질 위험이 없다. (idx 가 -1 이면 새 카드) */
async function saveMsCard(idx, rec) {
  const arr = vArr(ST.vision, 'milestones');
  const prev = ST.vision;
  const isNew = idx < 0;
  let next, at;
  try {
    if (isNew) {
      next = arr.slice();
      at = next.length;
      for (let k = 0; k < next.length; k++) {
        if (msLead(next[k] && next[k].year) > msLead(rec.year)) { at = k; break; }
      }
      next.splice(at, 0, rec);
    } else {
      next = arr.slice();
      next[idx] = rec;
    }
    ST.vision = { ...(prev || {}), milestones: next };
    closeSheet();
    render.sameTab = true; render();
    if (isNew) {
      // 뒤에서부터 한 칸씩 카드 단위로 밀어 넣고, 마지막에 새 카드를 그 자리에 쓴다.
      // 맨 뒤 카드(next.length-1)부터 써야 중간에 끼워 넣어도 마지막 연도가 사라지지 않는다.
      for (let k = next.length - 1; k > at; k--) await put('vision/milestones/' + k, next[k]);
      await put('vision/milestones/' + at, rec);
    } else {
      await put('vision/milestones/' + idx, rec);
    }
    toast(isNew ? '연도 카드를 추가했어요' : '연도 카드를 저장했어요');
  } catch (e) {
    ST.vision = prev;
    render.sameTab = true; render();
    toast('저장하지 못했어요');
  }
}
async function deleteMsCard(idx) {
  const arr = vArr(ST.vision, 'milestones');
  const prev = ST.vision;
  const next = arr.slice();
  next.splice(idx, 1);
  try {
    ST.vision = { ...(prev || {}), milestones: next };
    closeSheet();
    render.sameTab = true; render();
    // 뒤 카드들을 한 칸씩 당기고 맨 끝 칸만 삭제 (목록 전체 덮어쓰기 없음)
    for (let k = idx; k < next.length; k++) await put('vision/milestones/' + k, next[k]);
    await del('vision/milestones/' + (arr.length - 1));
    toast('연도 카드를 삭제했어요');
  } catch (e) {
    ST.vision = prev;
    render.sameTab = true; render();
    toast('저장하지 못했어요');
  }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function newKey(prefix) {
  return (prefix || 'k') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function openTradeSheet(id) {
  const isNew = !id;

    '<label class="fld"><span>세부 조건 · 메모 (선택)</span><textarea class="inp" id="ttMemo" placeholder="이자 조건, 시기, 은행, 확인할 것">' + esc(cur.memo || '') + '</textarea></label>' +

  const acts = '<button class="sh-save" id="ttSave">' + (isNew ? '추가' : '저장') + '</button>' +

  openSheet(isNew ? '갈아타기 전략 추가' : '갈아타기 전략 수정', body, acts);

    if (!title) { toast('전략 제목을 적어 주세요'); return; }
    const memo = $('#ttMemo').value.trim();
    const date = $('#ttDate').value || null;

      order = max + 1;

    catch (e) { ST.tradeUp = prevAll; render.sameTab = true; render(); toast('저장하지 못했어요'); }

/* ============================================================
   📘 플랜 (masterPlan)
   카드 내용도 전부 Firebase 방에서만 온다. 정적 코드에는 없다.
   ============================================================ */
function planRoot() {
  if (!ST.plan || typeof ST.plan !== 'object') ST.plan = {};
  if (!ST.plan.chapters || typeof ST.plan.chapters !== 'object') ST.plan.chapters = {};
  return ST.plan.chapters;
}
function plOrder(v, d) { const n = num(v); return n === null ? d : n; }
function planChapters() {
  const ch = planRoot();
  return entries(ch).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planSections(ch) {
  const s = (ch && ch.sections && typeof ch.sections === 'object') ? ch.sections : {};
  return entries(s).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planItems(sec) {
  const it = (sec && sec.items && typeof sec.items === 'object') ? sec.items : {};
  return entries(it).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planCount() {
  let n = 0;
  planChapters().forEach(ch => planSections(ch).forEach(sec => { n += planItems(sec).length; }));
  return n;
}
function planItemRow(cid, sid, it) {
  const badge = it.draft ? '<span class="bdraft">구상</span>' : '';
  const head = (it.label || it.draft)
    ? '<span class="lb">' + (it.label ? esc(it.label) : '') + badge + '</span>' : '';
  return '<button class="pl-item' + (it.draft ? ' draft' : '') + '" data-act="pl-item" data-c="' + esc(cid) +
    '" data-s="' + esc(sid) + '" data-i="' + esc(it.id) + '">' +
    '<span class="plb">' + head +
      '<span class="vv">' + esc(it.value || '') + '</span>' +
      (it.note ? '<span class="nt">' + esc(it.note) + '</span>' : '') +
    '</span><span class="chev">›</span></button>';
}
function planView() {
  const chs = planChapters();

    '<div class="card-h"><h2>📘 부부데이지 마스터 플랜</h2>' +
      (chs.length ? '<span class="pill navy">' + chs.length + '장</span>' : '') + '</div>' +
    (chs.length
      ? '<p class="pl-intro">브랜드 · 콘텐츠 · 채널 · 사업 구상 · 확정 전 항목을 한 장씩 모았어요. 항목을 눌러 바로 고칠 수 있어요.</p>' +
        '<div class="pl-count"><span class="pill">' + planCount() + '개 항목</span>' +
        '<span class="pill">확정 전은 구상 표시</span></div>'
      : '<p class="empty">플랜 데이터를 기다리고 있어요</p>') +

  if (!chs.length) return top;
  const cards = chs.map(ch => {

  return top + cards + '<p class="foot-note">항목을 누르면 고칠 수 있어요 · 아직 확정 전인 내용은 <b>구상</b>으로 표시돼요</p>';

/* ============================================================

const MEMO_KEY = 'bubudaisy.memos';
const TAB_NAMES = {
  vision: '세은', strategy: '전략', chankyu: '찬규', networth: '순자산'
};
let MEMOS = loadMemos();
function loadMemos() {
  try {
    const a = JSON.parse(localStorage.getItem(MEMO_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => x && x.text) : [];
  } catch (e) { return []; }
}
function saveMemos() {
  try { localStorage.setItem(MEMO_KEY, JSON.stringify(MEMOS)); } catch (e) {}
  paintMemoBadge();
}
function memoTabName(t) { return TAB_NAMES[t] || '기타'; }
function paintMemoBadge() {
  const b = $('#memoBtn'), c = $('#memoCnt');
  if (!b || !c) return;
  const n = MEMOS.length;
  b.classList.toggle('has', n > 0);
  c.textContent = n > 9 ? '9+' : String(n);
  c.classList.toggle('hidden', n === 0);
  b.setAttribute('aria-label', n ? '수정 요청 메모 ' + n + '개' : '수정 요청 메모');
}
function memoRows() {
  if (!MEMOS.length) return '<p class="empty">아직 적어 둔 요청이 없어요<br>고치고 싶은 곳을 그때그때 적어 두세요 🌼</p>';
  return MEMOS.map(m =>
    '<div class="memo-row"><span class="mt">' + esc(m.tab || '기타') + '</span>' +
    '<span class="mx">' + esc(m.text) + '</span>' +
    '<button class="memo-del" data-mdel="' + esc(m.id) + '" aria-label="삭제">✕</button></div>').join('');
}
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (!ok) throw new Error('copy failed');
}
function openMemoSheet() {
  const body =
    '<div class="fld"><span>요청 내용 · 지금 탭 [' + esc(memoTabName(ST.tab)) + ']</span>' +

    '<div class="memo-list" id="memoList">' + memoRows() + '</div>' +
    '<p class="hint-in">탭 이름이 앞에 자동으로 붙어요. 메모는 이 기기에만 저장되고, 탭을 옮겨도 그대로 남아요.</p>';
  const acts =
    '<button class="sh-save" id="memoCopy">📋 전체 복사</button>' +
    '<button class="sh-del" id="memoClear">🗑 목록 비우기</button>';
  openSheet('📝 두두에게 보낼 수정 요청', body, acts);

  const inp = $('#memoText');
  const addMemo = () => {
    const v = inp.value.trim();
    if (!v) { toast('요청 내용을 적어 주세요'); inp.focus(); return; }
    MEMOS.push({ id: newKey('m'), tab: memoTabName(ST.tab), text: v, at: Date.now() });
    saveMemos();
    inp.value = '';
    $('#memoList').innerHTML = memoRows();
    toast('메모를 추가했어요');
    inp.focus();
  };
  $('#memoAdd').addEventListener('click', addMemo);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMemo(); }
  });
  $('#memoList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mdel]');
    if (!b) return;
    MEMOS = MEMOS.filter(x => x.id !== b.dataset.mdel);
    saveMemos();
    $('#memoList').innerHTML = memoRows();
  });
  $('#memoCopy').addEventListener('click', async () => {
    if (!MEMOS.length) { toast('복사할 메모가 없어요'); return; }
    const text = 'BUBUDAISY 수정 요청:\n' +
      MEMOS.map(m => '- [' + (m.tab || '기타') + '] ' + m.text).join('\n');
    try { await copyText(text); toast('복사됐어요! 피클 채팅에 붙여넣어 주세요'); }
    catch (e) { toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요'); }
  });
  $('#memoClear').addEventListener('click', (e) => {
    if (!MEMOS.length) { toast('비울 메모가 없어요'); return; }
    const btn = e.currentTarget;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.classList.add('confirm');
      btn.textContent = '정말 비울까요?';
      return;
    }
    MEMOS = [];
    saveMemos();
    $('#memoList').innerHTML = memoRows();
    btn.dataset.armed = '';
    btn.classList.remove('confirm');
    btn.textContent = '🗑 목록 비우기';
    toast('메모를 모두 지웠어요');
  });
}
$('#memoBtn').addEventListener('click', openMemoSheet);
paintMemoBadge();

/* ============================================================
   시작
   ============================================================ */
function enter(room) {
  ROOM = room;
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  setLive('connecting');
  syncNow(true);
  connect();
  render.sameTab = false; render();
  startSeen();
  window.addEventListener('online', () => { syncNow(true); if (!es) connect(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { syncNow(true); if (!es) connect(); touchSeen(true); }
  });
}
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.h === VERIFY_HEX && ROOM_KEY_RE.test(saved.room || '')) {
    enter(saved.room);
  } else {
    paintPins();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
