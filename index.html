<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUBUDAISY</title>
<meta name="description" content="BUBUDAISY — 두 사람만의 비전·순자산 보드">
<meta name="theme-color" content="#FBE049">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BUBUDAISY">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --yellow:#FBE049;
    --yellow-deep:#F1D22F;
    --white:#FFFFFF;
    --cream:#FDF8E7;
    --cream-line:#F3ECD6;
    --navy:#1E1B7A;
    --navy-2:#2A2694;
    --green:#2F8F52;
    --green-soft:#E4F3E1;
    --ink:#20201C;
    --muted:#8A8674;
    --r:26px;
    --shadow:0 10px 24px rgba(112,86,0,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--yellow);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ================= 잠금 화면 ================= */
  #lock{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:var(--yellow);z-index:60}
  .lock-card{width:100%;max-width:344px;background:var(--white);border-radius:var(--r);
    padding:26px 22px 20px;text-align:center;box-shadow:0 18px 44px rgba(112,86,0,.20)}
  .lock-fl{font-size:42px;line-height:1}
  .lock-title{margin:6px 0 0;font-size:27px;font-weight:900;letter-spacing:-.03em;color:var(--navy);line-height:1.1}
  .lock-tag{margin:7px 0 0;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.01em}
  .lock-badge{display:inline-block;margin:14px 0 0;padding:5px 11px;border-radius:999px;
    background:var(--cream);color:#7C765C;font-size:11.5px;font-weight:800}
  .pin-dots{display:flex;justify-content:center;gap:13px;margin:20px 0 2px;height:16px}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#EDE7D1;transition:transform .12s,background .12s}
  .pin-dot.on{background:var(--navy);transform:scale(1.06)}
  .pin-msg{margin:10px 0 0;min-height:16px;font-size:12px;font-weight:800;color:#C0392B}
  .pin-msg.ok{color:var(--green)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
  .key{height:52px;border-radius:17px;background:var(--cream);color:var(--navy);
    font-size:22px;font-weight:800;letter-spacing:.02em;transition:transform .1s,background .15s}
  .key:active{transform:scale(.95);background:#F6EFD6}
  .key.ghost{background:transparent;color:var(--muted);font-size:17px}
  .lock-foot{margin:14px 0 0;font-size:11px;font-weight:700;color:#A9A48D;line-height:1.5}
  .shake{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ================= 앱 틀 ================= */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 8px}
  .brand{display:flex;align-items:center;gap:.28em;margin:0;font-size:23px;font-weight:900;
    letter-spacing:-.035em;color:var(--navy);line-height:1}
  .brand .fl{font-size:20px;transform:translateY(1px)}
  .top-right{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#BDB79B;transition:background .3s}
  .dot.live{background:var(--green)}
  .dot.warn{background:#D08A17}
  .dot.off{background:#A9A497}
  .lock-btn{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.55);font-size:14px;color:var(--navy)}
  #view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:2px 16px 20px;display:flex;flex-direction:column;gap:13px;scrollbar-width:none}
  #view > *{flex:0 0 auto}
  #view::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(112,86,0,.12)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;
    font-size:11px;font-weight:800;color:#8F8A73;letter-spacing:-.02em;transition:background .18s,color .18s}
  .tab .ic{font-size:17px;line-height:1;opacity:.55;transition:opacity .18s}
  .tab.on{color:var(--navy);background:var(--white);box-shadow:0 3px 10px rgba(112,86,0,.13)}
  .tab.on .ic{opacity:1}

  /* ================= 카드 ================= */
  .card{background:var(--white);border-radius:var(--r);padding:15px 16px 13px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-h h2{margin:0;font-size:14.5px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .pill{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#7C765C;background:var(--cream);
    padding:4px 9px;border-radius:999px;letter-spacing:-.02em}
  .pill.navy{color:#fff;background:var(--navy)}
  .pill.green{color:#fff;background:var(--green)}
  .hero{background:linear-gradient(155deg,#2B2799,#1E1B7A 62%);color:#fff;border-radius:var(--r);
    padding:16px 17px 15px;box-shadow:0 14px 28px rgba(30,27,122,.28);display:flex;flex-direction:column;gap:7px}
  .hero-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#CFCBF3;letter-spacing:-.01em}
  .hero-main{font-size:17px;font-weight:900;letter-spacing:-.035em;line-height:1.32}
  .hero-main b{color:#FFE680}
  .hero-sub{font-size:12.5px;font-weight:800;color:#D9D6F8}
  .big{font-size:26px;font-weight:900;letter-spacing:-.04em;color:var(--navy);line-height:1.1}
  .big small{font-size:13px;font-weight:800;color:var(--muted);margin-left:5px;letter-spacing:-.02em}
  .big-none{font-size:19px;font-weight:900;color:#B4AE97;letter-spacing:-.03em}
  .bar{height:9px;border-radius:999px;background:#EFEAD6;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--navy);width:0;
    transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar.green i{background:var(--green)}
  .bar-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:-.02em}
  .bar-meta b{color:var(--navy)}
  .rowline{display:flex;align-items:center;gap:9px;background:var(--cream);border-radius:14px;
    padding:10px 12px;font-size:12.5px;font-weight:700;letter-spacing:-.02em;line-height:1.45;color:#3A382E}
  .rowline .k{flex:0 0 auto;font-weight:900;color:#6E6851;font-size:11.5px}
  .rowline .v{flex:1 1 auto;min-width:0}
  .rowline .v b{color:var(--navy);font-weight:900}
  .rowline.green{background:var(--green-soft);color:#22502D}
  .rowline.green .v b{color:var(--green)}
  .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .checks li{display:flex;gap:8px;align-items:flex-start;background:var(--cream);border-radius:14px;
    padding:9px 12px;font-size:12.5px;font-weight:700;color:#3A382E;letter-spacing:-.02em;line-height:1.45}
  .checks li .tk{flex:0 0 auto;color:var(--green);font-weight:900;font-size:12px;line-height:1.5}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .steps li{display:flex;gap:9px;align-items:flex-start;background:var(--cream);border-radius:14px;padding:9px 12px}
  .steps .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;
    font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:1px}
  .steps .t{display:block;font-size:12.5px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.4}
  .steps .d{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:-.02em;line-height:1.4}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .chip{background:var(--cream);border-radius:14px;padding:11px 6px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:11px;font-weight:900;color:#4A4738;letter-spacing:-.02em}
  .chip .ci{font-size:18px;line-height:1}
  .cap{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:-.02em}
  .ms{display:flex;flex-direction:column;gap:8px}
  .ms-card{border-radius:16px;background:var(--cream);padding:11px 13px 10px}
  .ms-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .ms-h .y{font-size:15px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
  .ms-h .y.green{color:var(--green)}
  .ms-h .bd{font-size:10px;font-weight:900;color:#7C765C;background:#fff;padding:3px 8px;border-radius:999px}
  .ms ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .ms li{display:flex;gap:6px;font-size:11.5px;font-weight:700;color:#3A382E;letter-spacing:-.02em;line-height:1.4}
  .ms li .tk{color:var(--green);font-weight:900}
  .foot-note{margin:2px 4px 6px;font-size:10.5px;font-weight:700;color:#9A947C;text-align:center;letter-spacing:-.02em}

  /* ================= 순자산 ================= */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mini{background:var(--cream);border-radius:15px;padding:10px 12px}
  .mini .who{font-size:10.5px;font-weight:900;color:#7C765C;display:flex;align-items:center;gap:4px}
  .mini b{display:block;margin-top:3px;font-size:14.5px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
  .mini.chankyu b{color:#2A6E3C}
  .add-btn{width:100%;height:52px;border-radius:18px;background:var(--navy);color:#fff;
    font-size:14.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:7px;
    box-shadow:0 12px 24px rgba(30,27,122,.26);transition:transform .12s}
  .add-btn:active{transform:scale(.985)}
  .chart{display:flex;flex-direction:column;gap:7px}
  .crow{display:grid;grid-template-columns:54px 1fr 76px;align-items:center;gap:8px}
  .crow .cm{font-size:10.5px;font-weight:800;color:#7C765C;letter-spacing:-.02em}
  .crow .cbar{height:14px;background:var(--cream);border-radius:999px;overflow:hidden}
  .crow .cbar i{display:block;height:100%;border-radius:999px;background:var(--navy-2);opacity:.85}
  .crow .cv{font-size:10.5px;font-weight:900;color:var(--ink);text-align:right;letter-spacing:-.03em}
  .mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .mli{width:100%;text-align:left;background:var(--cream);border-radius:15px;padding:10px 12px;
    display:flex;align-items:center;gap:10px}
  .mli .mm{flex:0 0 auto;font-size:11.5px;font-weight:900;color:var(--navy);background:#fff;
    border-radius:9px;padding:5px 8px;letter-spacing:-.02em}
  .mli .mid{flex:1 1 auto;min-width:0}
  .mli .tot{display:block;font-size:12.5px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
  .mli .sub{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:-.02em}
  .mli .ch{flex:0 0 auto;color:#BDB79B;font-size:14px}
  .empty{padding:14px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);line-height:1.6}

  /* ================= 로드맵 ================= */
  .ycard{background:var(--white);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
  .yhead{width:100%;display:flex;align-items:center;gap:8px;padding:13px 15px;text-align:left}
  .ynum{flex:0 0 auto;font-size:16px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
  .ynum.done{color:var(--green)}
  .ymeta{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
  .mtag{font-size:10px;font-weight:800;color:#7C765C;background:var(--cream);border-radius:999px;
    padding:3px 7px;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mtag.green{color:#fff;background:var(--green)}
  .ychev{flex:0 0 auto;color:#BDB79B;font-size:12px;padding-right:2px;transition:transform .2s}
  .ycard.open .ychev{transform:rotate(180deg)}
  .ybody{display:none;padding:0 15px 13px;flex-direction:column;gap:7px}
  .ycard.open .ybody{display:flex}
  .ygoal{font-size:11.5px;font-weight:800;color:#4A4738;letter-spacing:-.02em;line-height:1.45;
    display:flex;gap:6px;background:var(--cream);border-radius:13px;padding:8px 11px}
  .ygoal .wk{flex:0 0 auto;font-size:10px;font-weight:900;color:#8F8A73;margin-top:1px}
  .ygrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ygrid.one{grid-template-columns:1fr}
  .ycell{background:var(--cream);border-radius:12px;padding:8px 10px}
  .ycell .l{font-size:9.5px;font-weight:900;color:#948E75;letter-spacing:-.01em}
  .ycell .v{font-size:11.5px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-top:2px}
  .ycell.navy .v{color:var(--navy)}
  .yplan{font-size:11px;font-weight:700;color:#4A4738;line-height:1.55;letter-spacing:-.02em;
    background:var(--cream);border-radius:13px;padding:9px 11px}
  .yplan .l{display:block;font-size:9.5px;font-weight:900;color:#948E75;margin-bottom:3px}
  .ynote{font-size:11px;font-weight:700;color:#7C765C;background:#FFFBF0;border:1px dashed var(--cream-line);
    border-radius:12px;padding:8px 10px;line-height:1.5}
  .yacts{display:flex;gap:6px;margin-top:2px}
  .yacts button{flex:1 1 0;height:36px;border-radius:12px;background:var(--cream);font-size:11.5px;
    font-weight:900;color:#6E6851;letter-spacing:-.02em}
  .yacts button.on{background:var(--green-soft);color:var(--green)}
  .yacts button.pen{background:#EFECFB;color:var(--navy)}

  /* ================= 목표 ================= */
  .goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .goal{display:flex;align-items:flex-start;gap:9px;background:var(--cream);border-radius:14px;padding:10px 11px}
  .goal .gcheck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid #DDD6BD;
    display:grid;place-items:center;font-size:11px;font-weight:900;color:transparent;transition:.15s}
  .goal.done .gcheck{background:var(--green);border-color:var(--green);color:#fff}
  .goal .gtext{flex:1 1 auto;min-width:0;text-align:left;font-size:12.5px;font-weight:700;
    color:#3A382E;line-height:1.45;letter-spacing:-.02em}
  .goal.done .gtext{color:#9A947C;text-decoration:line-through;text-decoration-color:#C6BFA6}
  .goal .gtext .gmemo{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#8F8A73;
    text-decoration:none;letter-spacing:-.02em}
  .affair{display:flex;flex-direction:column;gap:8px}
  .aff{display:flex;gap:9px;align-items:flex-start;background:#F4F3FE;border-radius:14px;padding:11px 12px}
  .aff .gcheck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid #C9C5EE;
    display:grid;place-items:center;font-size:11px;font-weight:900;color:transparent}
  .aff.done .gcheck{background:var(--navy);border-color:var(--navy);color:#fff}
  .aff .gtext{flex:1 1 auto;min-width:0;text-align:left;font-size:12.5px;font-weight:900;
    color:var(--navy);line-height:1.45;letter-spacing:-.025em}
  .aff.done .gtext{color:#8A86C4}
  .aff .gtext .gmemo{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#8F8A73;letter-spacing:-.02em}

  /* ================= 시트 ================= */
  .scrim{position:fixed;inset:0;background:rgba(30,27,60,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:560px;margin:0 auto;
    background:var(--white);border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -12px 34px rgba(30,27,60,.22)}
  .sheet.on{transform:translateY(0)}
  .sh-h{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 10px}
  .sh-h h3{margin:0;font-size:16px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .sh-x{width:30px;height:30px;border-radius:11px;background:var(--cream);color:#7C765C;font-size:14px;
    display:grid;place-items:center}
  .sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld > span{font-size:11px;font-weight:900;color:#8A8674;letter-spacing:-.02em;padding-left:2px}
  .inp{width:100%;background:var(--cream);border:1.5px solid transparent;border-radius:14px;
    padding:11px 12px;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.02em;outline:none;transition:border-color .15s}
  .inp:focus{border-color:var(--navy);background:#fff}
  textarea.inp{min-height:66px;resize:vertical;line-height:1.5;font-weight:700;font-size:13px}
  .unit-row{display:flex;gap:6px;align-items:center}
  .unit-row .inp{flex:1 1 auto}
  .ym-row{display:flex;gap:8px}
  .ym-row .sel{position:relative;flex:1 1 0;display:block}
  .ym-row select{width:100%;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;padding-left:26px;padding-right:26px}
  .ym-row .sel i{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#B3AC90;
    font-style:normal;font-size:10px;pointer-events:none}
  .unit-seg{flex:0 0 auto;display:flex;background:var(--cream);border-radius:12px;padding:3px}
  .unit-seg button{padding:7px 10px;border-radius:9px;font-size:11px;font-weight:900;color:#8A8674;letter-spacing:-.02em}
  .unit-seg button.on{background:var(--navy);color:#fff}
  .sum-preview{background:var(--green-soft);border-radius:14px;padding:11px 12px;display:flex;
    align-items:center;justify-content:space-between;gap:8px}
  .sum-preview .k{font-size:11.5px;font-weight:900;color:#2A6039}
  .sum-preview .v{font-size:15px;font-weight:900;color:var(--green);letter-spacing:-.03em}
  .sh-acts{flex:0 0 auto;display:flex;gap:8px;padding-top:10px}
  .sh-save{flex:1 1 auto;height:50px;border-radius:16px;background:var(--navy);color:#fff;
    font-size:14.5px;font-weight:900;letter-spacing:-.02em;box-shadow:0 10px 20px rgba(30,27,122,.24)}
  .sh-del{flex:0 0 auto;height:50px;padding:0 16px;border-radius:16px;background:#FBEAE7;color:#C0392B;
    font-size:12.5px;font-weight:900;letter-spacing:-.02em}
  .sh-del.confirm{background:#C0392B;color:#fff}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(32,32,28,.92);color:#fff;font-size:12px;font-weight:800;letter-spacing:-.02em;
    padding:9px 15px;border-radius:999px;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .skeleton{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
    font-size:12.5px;font-weight:800;color:var(--muted);text-align:center}
</style>
</head>
<body>

<!-- ===== 잠금 ===== -->
<div id="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-fl">🌼</div>
    <h1 class="lock-title">BUBUDAISY</h1>
    <p class="lock-tag">매일 행복하고, 매일 배우며, 함께하는 우리</p>
    <span class="lock-badge">🔒 두 사람만의 비밀 보드</span>
    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
    </div>
    <p class="pin-msg" id="pinMsg"></p>
    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key ghost" data-k="clear">전체</button><button class="key" data-k="0">0</button><button class="key ghost" data-k="del" aria-label="지우기">←</button>
    </div>
    <p class="lock-foot">두 분만 아는 6자리 비밀번호를 입력하면<br>이 기기에서는 다음부터 바로 열려요</p>
  </div>
</div>

<!-- ===== 앱 ===== -->
<div id="app" class="hidden">
  <div class="top">
    <h1 class="brand">BUBUDAISY<span class="fl">🌼</span></h1>
    <div class="top-right">
      <span class="dot" id="dot" title="연결 확인 중"></span>
      <button class="lock-btn" id="lockBtn" aria-label="잠그기">🔒</button>
    </div>
  </div>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="vision"><span class="ic">🌼</span>비전</button>
    <button class="tab" data-tab="networth"><span class="ic">💰</span>순자산</button>
    <button class="tab" data-tab="roadmap"><span class="ic">🗓️</span>로드맵</button>
    <button class="tab" data-tab="goals"><span class="ic">🎯</span>목표</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sh-h"><h3 id="shTitle">입력</h3><button class="sh-x" id="shX" aria-label="닫기">✕</button></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-acts" id="shActs"></div>
</section>

<script>
'use strict';
/* ============================================================
   BUBUDAISY — 두 사람만의 비전·순자산 보드
   정적 코드에는 어떤 개인 데이터도 없다. 모든 내용은
   비밀번호에서 파생된 비공개 방(Firebase RTDB)에만 있다.
   ============================================================ */

/* ---------- 설정 ---------- */
const DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';
const PBKDF2_SALT = 'bubudaisy::v1';
const PBKDF2_ITER = 210000;
const VERIFY_HEX = 'c94584ef0ca10084ad0655e469418be1f0dad47b16e4762adc1d36b35c5144ec';
const AUTH_KEY = 'bubudaisy.auth';
const ROOM_KEY_RE = /^bubudaisy-[a-z0-9]{12,32}$/;

const TABS = ['vision', 'networth', 'roadmap', 'goals'];

/* ---------- 도우미 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
function fmtMan(v) {
  const n = num(v);
  if (n === null) return '—';
  const a = Math.abs(Math.round(n));
  const sign = n < 0 ? '-' : '';
  if (a >= 10000) {
    const eok = Math.floor(a / 10000), man = a % 10000;
    return sign + eok.toLocaleString('ko-KR') + '억' + (man ? ' ' + man.toLocaleString('ko-KR') + '만원' : '원');
  }
  return sign + a.toLocaleString('ko-KR') + '만원';
}
function fmtNum(v, unit) {
  const n = num(v);
  if (n === null) return '—';
  return Math.round(n).toLocaleString('ko-KR') + (unit || '');
}
function monthLabel(m) {
  const mm = /^(\d{4})-(\d{2})$/.exec(String(m || ''));
  return mm ? mm[1] + '.' + mm[2] : String(m || '');
}
function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.remove(), 2200);
}
function entries(obj) {
  return Object.entries(obj || {}).filter(([, v]) => v && typeof v === 'object');
}
function hex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- 상태 ---------- */
const ST = {
  vision: null, netWorth: {}, roadmap: {}, goals: {}, affirmations: {},
  tab: 'vision', loaded: false
};
let ROOM = '';
let es = null, retry = 0, pollTimer = null;
const OPEN_YEARS = new Set();
const draft = {};

/* ============================================================
   잠금
   ============================================================ */
const pin = { buf: '' };

function paintPins() {
  $$('#pinDots .pin-dot').forEach((d, i) => d.classList.toggle('on', i < pin.buf.length));
}
async function derive(pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(PBKDF2_SALT), iterations: PBKDF2_ITER, hash: 'SHA-256' },
    key, 512);
  return hex(bits);
}
let checking = false;
async function tryUnlock() {
  if (checking) return;
  checking = true;
  const msg = $('#pinMsg');
  msg.className = 'pin-msg'; msg.textContent = '확인 중…';
  try {
    if (!(window.crypto && crypto.subtle)) {
      msg.textContent = '보안 연결(https)에서 열어 주세요';
      checking = false; return;
    }
    const bits = await derive(pin.buf);
    if (bits.slice(0, 64) !== VERIFY_HEX) {
      msg.textContent = '비밀번호가 맞지 않아요';
      const card = $('#lockCard');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      pin.buf = ''; paintPins();
      checking = false; return;
    }
    const room = 'bubudaisy-' + bits.slice(64, 84);
    localStorage.setItem(AUTH_KEY, JSON.stringify({ h: VERIFY_HEX, room, at: Date.now() }));
    msg.className = 'pin-msg ok'; msg.textContent = '열리는 중…';
    enter(room);
  } catch (e) {
    msg.textContent = '잠시 후 다시 시도해 주세요';
  }
  checking = false;
}
function pushKey(k) {
  const msg = $('#pinMsg');
  if (msg.textContent) { msg.textContent = ''; msg.className = 'pin-msg'; }
  if (k === 'del') { pin.buf = pin.buf.slice(0, -1); paintPins(); return; }
  if (k === 'clear') { pin.buf = ''; paintPins(); return; }
  if (pin.buf.length >= 6) return;
  pin.buf += k;
  paintPins();
  if (pin.buf.length === 6) setTimeout(tryUnlock, 110);
}
$('#pad').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]');
  if (b) pushKey(b.dataset.k);
});
document.addEventListener('keydown', (e) => {
  if ($('#lock').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) pushKey(e.key);
  else if (e.key === 'Backspace') pushKey('del');
  else if (e.key === 'Enter' && pin.buf.length === 6) tryUnlock();
});

function lockNow(reload) {
  localStorage.removeItem(AUTH_KEY);
  if (es) { try { es.close(); } catch (e) {} es = null; }
  stopPolling();
  ST.loaded = false; ST.vision = null; ST.netWorth = {}; ST.roadmap = {};
  ST.goals = {}; ST.affirmations = {};
  pin.buf = ''; paintPins();
  const msg = $('#pinMsg'); msg.className = 'pin-msg'; msg.textContent = '';
  $('#app').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#view').innerHTML = '';
  if (reload) location.reload();
}
$('#lockBtn').addEventListener('click', () => lockNow(false));

/* ============================================================
   동기화
   ============================================================ */
const roomUrl = () => DB + '/rooms/' + ROOM + '.json';
const nodeUrl = (p) => DB + '/rooms/' + ROOM + '/' + p + '.json';

function setLive(state) {
  const el = $('#dot'); if (!el) return;
  el.className = 'dot ' + state;
  el.title = state === 'live' ? '실시간 연결됨' : state === 'warn' ? '다시 연결 중' : state === 'off' ? '오프라인' : '연결 중';
}
function absorb(d) {
  d = d || {};
  const v = d.vision && typeof d.vision === 'object' ? d.vision : null;
  if (v) {
    // 배열/숫자 정규화
    if (Array.isArray(v.strategy)) v.strategy = v.strategy.filter(Boolean);
    if (Array.isArray(v.pledge)) v.pledge = v.pledge.filter(Boolean);
    if (Array.isArray(v.milestones)) v.milestones = v.milestones.filter(Boolean);
    if (Array.isArray(v.expertise)) v.expertise = v.expertise.filter(Boolean);
    if (v.goal && Array.isArray(v.goal.items)) v.goal.items = v.goal.items.filter(Boolean);
  }
  ST.vision = v;
  ST.netWorth = d.netWorth || {};
  ST.roadmap = d.roadmap || {};
  ST.goals = d.goals || {};
  ST.affirmations = d.affirmations || {};
  ST.loaded = true;
}
async function syncNow(quiet) {
  try {
    const r = await fetch(roomUrl(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    absorb(await r.json());
    if (!es) setLive('live');
    render(); stopPolling();
  } catch (e) {
    if (!quiet) toast('연결을 확인해 주세요');
    setLive(navigator.onLine ? 'warn' : 'off');
  }
}
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => { if (!es) syncNow(true); }, 9000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function connect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  setLive(retry ? 'warn' : 'connecting');
  try { es = new EventSource(roomUrl()); } catch (e) { setLive('off'); return; }
  es.addEventListener('put', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    retry = 0; setLive('live'); stopPolling();
    if (m.path === '/' || m.path === '') { absorb(m.data); scheduleRender(); return; }
    const segs = m.path.split('/').filter(Boolean);
    if (segs.length === 1) { applyNode(segs[0], m.data); scheduleRender(); return; }
    syncNow(true);
  });
  es.addEventListener('patch', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    retry = 0; setLive('live'); stopPolling();
    const segs = (m.path === '/' ? '' : m.path).split('/').filter(Boolean);
    if (segs.length <= 1 && m.data && typeof m.data === 'object') {
      const root = segs.length ? segs[0] : '';
      Object.entries(m.data).forEach(([k, v]) => {
        if (!root) applyNode(k, v);
        else applyChild(root, k, v);
      });
      scheduleRender();
      return;
    }
    syncNow(true);
  });
  es.onopen = () => { retry = 0; setLive('live'); stopPolling(); };
  es.onerror = () => { setLive(navigator.onLine ? 'warn' : 'off'); reconnect(); startPolling(); };
}
function applyNode(name, data) {
  const map = { netWorth: ST.netWorth, roadmap: ST.roadmap, goals: ST.goals, affirmations: ST.affirmations };
  if (name === 'vision') { absorb({ vision: data, netWorth: ST.netWorth, roadmap: ST.roadmap, goals: ST.goals, affirmations: ST.affirmations }); return; }
  if (map[name]) { map[name] = data || {}; }
}
function applyChild(root, key, val) {
  const map = { netWorth: ST.netWorth, roadmap: ST.roadmap, goals: ST.goals, affirmations: ST.affirmations };
  if (!map[root]) return;
  if (val === null || val === undefined) delete map[root][key];
  else map[root][key] = val;
}
function reconnect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  retry = Math.min(retry + 1, 6);
  const wait = Math.min(900 * Math.pow(1.7, retry), 15000);
  setTimeout(() => { if (!es) connect(); }, wait);
}
async function put(path, val) {
  const r = await fetch(nodeUrl(path), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
async function patch(path, val) {
  const r = await fetch(nodeUrl(path), {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
async function del(path) {
  const r = await fetch(nodeUrl(path), { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

/* ============================================================
   파생 값
   ============================================================ */
function nwSorted() {
  return entries(ST.netWorth)
    .map(([m, v]) => ({
      month: m,
      seeun: num(v.seeun) || 0,
      chankyu: num(v.chankyu) || 0,
      memo: v.memo || '',
      updatedAt: v.updatedAt || 0
    }))
    .sort((a, b) => a.month < b.month ? 1 : a.month > b.month ? -1 : 0);
}
function latestNw() { const l = nwSorted(); return l.length ? l[0] : null; }
function targetMan() {
  const t = ST.vision && ST.vision.target;
  return t ? num(t.netWorth) : null;
}
function pctOf(total) {
  const t = targetMan();
  if (!t || total == null) return null;
  return total / t * 100;
}
function yearSorted() {
  return entries(ST.roadmap)
    .map(([y, v]) => ({ year: y, ...v }))
    .sort((a, b) => Number(a.year) - Number(b.year));
}
function goalList() {
  return entries(ST.goals).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (Number(a.order ?? 99) - Number(b.order ?? 99)) || a.id.localeCompare(b.id));
}
function affList() {
  return entries(ST.affirmations).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (Number(a.order ?? 99) - Number(b.order ?? 99)) || a.id.localeCompare(b.id));
}

/* ============================================================
   화면
   ============================================================ */
let renderTimer = null;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 90);
}
function render() {
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ST.tab));
  const view = $('#view');
  const keep = view.scrollTop;
  if (!ST.loaded) {
    view.innerHTML = '<div class="skeleton">불러오는 중…</div>';
    return;
  }
  if (ST.tab === 'vision') view.innerHTML = visionView();
  else if (ST.tab === 'networth') view.innerHTML = netWorthView();
  else if (ST.tab === 'roadmap') view.innerHTML = roadmapView();
  else view.innerHTML = goalsView();
  if (render.sameTab) view.scrollTop = keep;
  render.sameTab = true;
}
function go(tab) {
  if (ST.tab === tab) return;
  ST.tab = tab;
  render.sameTab = false;
  render();
  $('#view').scrollTop = 0;
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (b) go(b.dataset.tab);
});

/* ---------- 1. 비전보드 ---------- */
function visionView() {
  const v = ST.vision;
  const nw = latestNw();
  const total = nw ? nw.seeun + nw.chankyu : null;
  const pct = pctOf(total);
  const target = targetMan();

  let hero;
  if (!v) {
    hero = '<section class="hero"><div class="hero-top"><span>🌼</span> BUBUDAISY</div>' +
      '<div class="hero-main">비전보드 데이터를 기다리고 있어요</div>' +
      '<div class="hero-sub">한 번만 준비되면 여기에 우리의 10년이 담겨요</div></section>';
  } else {
    const t = v.target || {};
    hero = '<section class="hero">' +
      '<div class="hero-top"><span>🚩</span><span>' + esc((t.year || '') + '년' + (t.age ? ' · 만 ' + t.age + '세' : '')) + '</span></div>' +
      '<div class="hero-main"><b>' + esc(t.headline || '') + '</b></div>' +
      (t.plus ? '<div class="hero-sub">' + esc(t.plus) + '</div>' : '') +
      '</section>';
  }

  let progress = '';
  if (v && target) {
    progress = '<section class="card">' +
      '<div class="card-h"><h2>지금 우리의 순자산</h2><span class="pill">2035 목표 ' + esc(fmtMan(target)) + '</span></div>' +
      '<div class="big">' + (total === null ? '<span class="big-none">아직 기록 전</span>' : esc(fmtMan(total))) + '</div>' +
      '<div class="bar"><i style="width:' + (pct === null ? 0 : Math.min(100, Math.max(0, pct)).toFixed(1)) + '%"></i></div>' +
      '<div class="bar-meta"><span>달성률 <b>' + (pct === null ? '—' : pct.toFixed(1) + '%') + '</b></span>' +
      '<span>' + (total === null ? '이번 달부터 기록해 보세요' : '남은 금액 <b>' + esc(fmtMan(Math.max(0, target - total))) + '</b>') + '</span></div>' +
      (total === null ? '<button class="rowline" data-go="networth" style="justify-content:center"><span class="v" style="text-align:center"><b>이번 달 순자산 기록하러 가기 →</b></span></button>' : '') +
      '</section>';
  }

  let goal = '';
  if (v && v.goal) {
    const items = (v.goal.items || []).map(it =>
      '<div class="rowline"><span class="k">' + esc(it.label) + '</span><span class="v" style="text-align:right"><b>' + esc(it.value) + '</b></span></div>'
    ).join('');
    goal = '<section class="card">' +
      '<div class="card-h"><h2>🌱 우리의 목표</h2><span class="pill">' + esc(v.goal.caption || '') + '</span></div>' +
      items +
      '<div class="rowline green"><span class="v" style="text-align:center"><b>→ ' + esc(v.goal.sum || '') + '</b></span></div>' +
      '</section>';
  }

  let strategy = '';
  if (v && Array.isArray(v.strategy) && v.strategy.length) {
    strategy = '<section class="card">' +
      '<div class="card-h"><h2>🧭 핵심 전략</h2></div>' +
      '<ul class="steps">' + v.strategy.map((s, i) =>
        '<li><span class="n">' + (i + 1) + '</span><span><span class="t">' + esc(s.title || '') + '</span>' +
        (s.desc ? '<span class="d">' + esc(s.desc) + '</span>' : '') + '</span></li>').join('') +
      '</ul></section>';
  }

  let expertise = '';
  if (v && Array.isArray(v.expertise) && v.expertise.length) {
    expertise = '<section class="card">' +
      '<div class="card-h"><h2>📚 전문성 영역</h2></div>' +
      '<div class="chips">' + v.expertise.map(x =>
        '<div class="chip"><span class="ci">' + esc(x.emoji || '') + '</span>' + esc(x.label || '') + '</div>').join('') +
      '</div>' +
      (v.expertiseCaption ? '<p class="cap">' + esc(v.expertiseCaption) + '</p>' : '') +
      '</section>';
  }

  let pledge = '';
  if (v && Array.isArray(v.pledge) && v.pledge.length) {
    pledge = '<section class="card">' +
      '<div class="card-h"><h2>💛 우리의 다짐</h2></div>' +
      '<ul class="checks">' + v.pledge.map(p => '<li><span class="tk">✓</span><span>' + esc(p) + '</span></li>').join('') +
      '</ul></section>';
  }

  let ms = '';
  if (v && Array.isArray(v.milestones) && v.milestones.length) {
    ms = '<section class="card">' +
      '<div class="card-h"><h2>🗓️ 연도별 이정표</h2><span class="pill">' + esc((v.milestones[0] && v.milestones[0].year) || '') + '~</span></div>' +
      '<div class="ms">' + v.milestones.map(m =>
        '<div class="ms-card"><div class="ms-h"><span class="y' + (m.tone === 'green' ? ' green' : '') + '">' + esc(m.year) + '</span>' +
        (m.badge ? '<span class="bd">' + esc(m.badge) + '</span>' : '') + '</div>' +
        '<ul>' + (m.items || []).map(i => '<li><span class="tk">✓</span><span>' + esc(i) + '</span></li>').join('') + '</ul></div>').join('') +
      '</div></section>';
  }

  const foot = (v && v.footer) ? '<p class="foot-note">' + esc(v.footer) + '</p>' : '';
  return hero + progress + goal + strategy + expertise + pledge + ms + foot;
}

/* ---------- 2. 월별 순자산 ---------- */
function netWorthView() {
  const list = nwSorted();
  const latest = list[0] || null;
  const target = targetMan();
  const total = latest ? latest.seeun + latest.chankyu : null;
  const pct = pctOf(total);

  let sum;
  if (!latest) {
    sum = '<section class="card">' +
      '<div class="card-h"><h2>부부 순자산</h2><span class="pill">기록 전</span></div>' +
      '<p class="empty">아직 순자산 기록이 없어요<br>이번 달부터 한 달에 한 번씩 남겨 보세요 🌼</p>' +
      '</section>';
  } else {
    sum = '<section class="card">' +
      '<div class="card-h"><h2>부부 순자산</h2><span class="pill">' + esc(monthLabel(latest.month)) + ' 기준</span></div>' +
      '<div class="big">' + esc(fmtMan(total)) + '</div>' +
      '<div class="split">' +
        '<div class="mini"><span class="who">👩🏻 세은</span><b>' + esc(fmtMan(latest.seeun)) + '</b></div>' +
        '<div class="mini chankyu"><span class="who">👨🏻 찬규</span><b>' + esc(fmtMan(latest.chankyu)) + '</b></div>' +
      '</div>' +
      (target ? '<div class="bar green"><i style="width:' + (pct === null ? 0 : Math.min(100, Math.max(0, pct)).toFixed(1)) + '%"></i></div>' +
        '<div class="bar-meta"><span>2035 목표 대비 <b>' + (pct === null ? '—' : pct.toFixed(1) + '%') + '</b></span><span>목표 ' + esc(fmtMan(target)) + '</span></div>' : '') +
      (latest.memo ? '<div class="ynote">📝 ' + esc(latest.memo) + '</div>' : '') +
      '</section>';
  }

  const addBtn = '<button class="add-btn" data-act="nw-add">+ 이번 달 순자산 입력</button>';

  let chart = '';
  if (list.length >= 2) {
    const recent = list.slice(0, 6).slice().reverse();
    const max = Math.max(...recent.map(x => Math.max(1, x.seeun + x.chankyu)));
    chart = '<section class="card">' +
      '<div class="card-h"><h2>순자산 추이</h2><span class="pill">최근 ' + recent.length + '개월</span></div>' +
      '<div class="chart">' + recent.map(x => {
        const t = x.seeun + x.chankyu;
        const w = Math.max(4, Math.round(t / max * 100));
        return '<div class="crow"><span class="cm">' + esc(monthLabel(x.month)) + '</span>' +
          '<span class="cbar"><i style="width:' + w + '%"></i></span>' +
          '<span class="cv">' + esc(fmtMan(t)) + '</span></div>';
      }).join('') + '</div></section>';
  }

  let mlist = '';
  if (list.length) {
    mlist = '<section class="card">' +
      '<div class="card-h"><h2>월별 기록</h2><span class="pill">' + list.length + '개</span></div>' +
      '<ul class="mlist">' + list.map(x =>
        '<li><button class="mli" data-act="nw-edit" data-month="' + esc(x.month) + '">' +
        '<span class="mm">' + esc(monthLabel(x.month)) + '</span>' +
        '<span class="mid"><span class="tot">' + esc(fmtMan(x.seeun + x.chankyu)) + '</span>' +
        '<span class="sub">세은 ' + esc(fmtMan(x.seeun)) + ' · 찬규 ' + esc(fmtMan(x.chankyu)) + '</span></span>' +
        '<span class="ch">›</span></button></li>').join('') +
      '</ul></section>';
  }
  return sum + addBtn + chart + mlist;
}

/* ---------- 3. 연도별 로드맵 ---------- */
function roadmapView() {
  const list = yearSorted();
  if (!list.length) {
    return '<section class="card"><div class="card-h"><h2>연도별 로드맵</h2></div>' +
      '<p class="empty">로드맵 데이터를 기다리고 있어요</p></section>';
  }
  const curYear = String(new Date().getFullYear());
  const cards = list.map(y => {
    const year = y.year;
    const open = OPEN_YEARS.has(year) || year === curYear;
    const tags = [];
    if (y.live) tags.push(y.live);
    if (y.life) tags.push(y.life);
    if (y.buy) tags.push('매수 ' + y.buy);
    const ageTxt = (num(y.age_seeun) !== null && num(y.age_chankyu) !== null)
      ? '👩🏻' + y.age_seeun + ' · 👨🏻' + y.age_chankyu : '';
    const salaryCells = [
      num(y.salary_seeun) !== null ? '<div class="ycell navy"><div class="l">세은 월급</div><div class="v">' + fmtNum(y.salary_seeun, '만') + '</div></div>' : '',
      num(y.salary_chankyu) !== null ? '<div class="ycell navy"><div class="l">찬규 월급</div><div class="v">' + fmtNum(y.salary_chankyu, '만') + '</div></div>' : '',
      num(y.saving) !== null ? '<div class="ycell"><div class="l">저축 여력</div><div class="v">' + fmtNum(y.saving, '백만') + '</div></div>' : '',
      y.cashflow ? '<div class="ycell"><div class="l">월급외</div><div class="v">' + esc(y.cashflow) + '</div></div>' : ''
    ].filter(Boolean);
    const salaryRows = salaryCells.join('');
    const goalRows = [
      y.goal_seeun ? '<div class="ygoal"><span class="wk">세은</span><span>' + esc(y.goal_seeun) + '</span></div>' : '',
      y.goal_chankyu ? '<div class="ygoal"><span class="wk">찬규</span><span>' + esc(y.goal_chankyu) + '</span></div>' : ''
    ].join('');
    const dealCells = [
      y.buy ? '<div class="ycell navy"><div class="l">매수</div><div class="v">' + esc(y.buy) + '</div></div>' : '',
      y.sell ? '<div class="ycell"><div class="l">매도</div><div class="v">' + esc(y.sell) + '</div></div>' : '',
      y.taxfree ? '<div class="ycell"><div class="l">비과세</div><div class="v">' + esc(y.taxfree) + '</div></div>' : ''
    ].filter(Boolean);
    const dealRows = dealCells.join('');
    return '<article class="ycard' + (open ? ' open' : '') + '" data-year="' + esc(year) + '">' +
      '<button class="yhead" data-act="y-toggle" data-year="' + esc(year) + '">' +
        '<span class="ynum' + (y.done ? ' done' : '') + '">' + esc(year) + (y.done ? ' ✓' : '') + '</span>' +
        '<span class="ymeta">' +
          (ageTxt ? '<span class="mtag">' + esc(ageTxt) + '</span>' : '') +
          tags.slice(0, 2).map(t => '<span class="mtag">' + esc(t) + '</span>').join('') +
          (y.memo ? '<span class="mtag green">📝 메모</span>' : '') +
        '</span>' +
        '<span class="ychev">▾</span>' +
      '</button>' +
      '<div class="ybody">' +
        goalRows +
        (dealRows ? '<div class="ygrid' + (dealCells.length === 1 ? ' one' : '') + '">' + dealRows + '</div>' : '') +
        (y.plan ? '<div class="yplan"><span class="l">매수방안</span>' + esc(y.plan) + '</div>' : '') +
        (salaryRows ? '<div class="ygrid' + (salaryCells.length === 1 ? ' one' : '') + '">' + salaryRows + '</div>' : '') +
        (y.memo ? '<div class="ynote">📝 ' + esc(y.memo) + '</div>' : '') +
        '<div class="yacts">' +
          '<button data-act="y-done" data-year="' + esc(year) + '" class="' + (y.done ? 'on' : '') + '">' + (y.done ? '✓ 완료함' : '✓ 완료 표시') + '</button>' +
          '<button data-act="y-edit" data-year="' + esc(year) + '" class="pen">✏️ 수정 · 메모</button>' +
        '</div>' +
      '</div></article>';
  }).join('');
  return cards;
}

/* ============================================================
   이벤트 — 화면
   ============================================================ */
$('#view').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const act = el.dataset.act;
  if (act === 'nw-add') return openNwSheet(thisMonth());
  if (act === 'nw-edit') return openNwSheet(el.dataset.month);
  if (act === 'y-toggle') {
    const y = el.dataset.year;
    if (OPEN_YEARS.has(y)) OPEN_YEARS.delete(y); else OPEN_YEARS.add(y);
    render.sameTab = true; render();
    return;
  }
  if (act === 'y-done') {
    const y = el.dataset.year;
    const cur = ST.roadmap[y] || {};
    const next = !cur.done;
    ST.roadmap[y] = { ...cur, done: next, doneAt: next ? Date.now() : null };
    render.sameTab = true; render();
    try { await patch('roadmap/' + y, { done: next, doneAt: next ? Date.now() : null }); toast(next ? y + ' 완료로 표시했어요' : '완료를 풀었어요'); }
    catch (err) { ST.roadmap[y] = cur; render.sameTab = true; render(); toast('저장하지 못했어요'); }
    return;
  }
  if (act === 'y-edit') return openRoadSheet(el.dataset.year);
  if (act === 'g-toggle') {
    const kind = el.dataset.kind, id = el.dataset.id;
    const cur = ST[kind][id]; if (!cur) return;
    const next = !cur.done;
    ST[kind][id] = { ...cur, done: next, doneAt: next ? Date.now() : null };
    render.sameTab = true; render();
    try { await patch(kind + '/' + id, { done: next, doneAt: next ? Date.now() : null }); }
    catch (err) { ST[kind][id] = cur; render.sameTab = true; render(); toast('저장하지 못했어요'); }
    return;
  }
  if (act === 'g-edit') return openGoalSheet(el.dataset.kind, el.dataset.id);
});

function openSheet(title, bodyHtml, actsHtml) {
  $('#shTitle').textContent = title;
  $('#shBody').innerHTML = bodyHtml;
  $('#shActs').innerHTML = actsHtml;
  $('#scrim').classList.add('on');
  $('#sheet').classList.add('on');
  $('#sheet').setAttribute('aria-hidden', 'false');
}
function closeSheet() {
  $('#scrim').classList.remove('on');

  $('#sheet').setAttribute('aria-hidden', 'true');
}

/* ---------- 순자산 입력 시트 ---------- */
function nwUnitsInit(man) {
  const u = { seeun: 'man', chankyu: 'man' };
  return u;
}
function fromMan(man, unit) {
  if (man === null || man === undefined || man === '') return '';
  const v = unit === 'eok' ? man / 10000 : man;
  return String(Math.round(v * 10000) / 10000);
}
function toMan(val, unit) {
  const n = Number(val);
  if (!Number.isFinite(n)) return null;
  return unit === 'eok' ? Math.round(n * 10000) : Math.round(n);
}
function openNwSheet(month) {
  const cur = ST.netWorth[month] || null;
  draft.nw = {
    month: month || thisMonth(),
    seeun: cur ? num(cur.seeun) ?? 0 : null,
    chankyu: cur ? num(cur.chankyu) ?? 0 : null,
    memo: cur ? (cur.memo || '') : '',
    unit: { seeun: 'man', chankyu: 'man' },
    editing: !!cur
  };
  const d = draft.nw;
  const [curY, curM] = d.month.split('-');
  const nowY = new Date().getFullYear();
  const years = [];
  for (let y = Math.min(nowY - 3, Number(curY) || nowY); y <= Math.max(nowY + 6, Number(curY) || nowY); y++) years.push(y);
  const body =
    '<div class="fld"><span>년-월</span><div class="ym-row">' +
      '<span class="sel"><select class="inp" id="nwYear">' + years.map(y =>
        '<option value="' + y + '"' + (String(y) === curY ? ' selected' : '') + '>' + y + '년</option>').join('') + '</select><i>▾</i></span>' +
      '<span class="sel"><select class="inp" id="nwMon">' + Array.from({ length: 12 }, (_, i) => i + 1).map(m =>
        '<option value="' + String(m).padStart(2, '0') + '"' +
        (String(m).padStart(2, '0') === curM ? ' selected' : '') + '>' + m + '월</option>').join('') + '</select><i>▾</i></span>' +
    '</div></div>' +
    '<div class="fld"><span>세은 순자산</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwSeeun" placeholder="0" value="' + esc(fromMan(d.seeun, 'man')) + '">' +
      '<div class="unit-seg" data-who="seeun"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="fld"><span>찬규 순자산</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwChankyu" placeholder="0" value="' + esc(fromMan(d.chankyu, 'man')) + '">' +
      '<div class="unit-seg" data-who="chankyu"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="sum-preview"><span class="k">부부 합계</span><span class="v" id="nwSum">—</span></div>' +
    '<label class="fld"><span>메모 (선택)</span><textarea class="inp" id="nwMemo" placeholder="예: 예금·주식·부동산 합계">' + esc(d.memo) + '</textarea></label>' +
    '<p class="cap" style="text-align:left">대출·부채를 뺀 순수 자산으로 적어 주세요. 만원 단위로 저장돼요.</p>';

  const acts = '<button class="sh-save" id="nwSave">' + (d.editing ? '수정 저장' : '저장') + '</button>' +
    (d.editing ? '<button class="sh-del" id="nwDel">삭제</button>' : '');

  openSheet(d.editing ? '순자산 수정' : '이번 달 순자산 입력', body, acts);

  const upd = () => {
    const s = toMan($('#nwSeeun').value, d.unit.seeun);
    const c = toMan($('#nwChankyu').value, d.unit.chankyu);
    const total = (s === null ? 0 : s) + (c === null ? 0 : c);
    $('#nwSum').textContent = (s === null && c === null) ? '—' : fmtMan(total);
  };
  upd();
  const syncMonth = () => { d.month = $('#nwYear').value + '-' + $('#nwMon').value; };
  $('#nwYear').addEventListener('change', syncMonth);
  $('#nwMon').addEventListener('change', syncMonth);
  $('#nwSeeun').addEventListener('input', upd);
  $('#nwChankyu').addEventListener('input', upd);
  $$('.unit-seg', $('#shBody')).forEach(seg => {
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('[data-u]'); if (!b) return;
      const who = seg.dataset.who;
      if (d.unit[who] === b.dataset.u) return;
      const input = who === 'seeun' ? $('#nwSeeun') : $('#nwChankyu');
      const man = toMan(input.value, d.unit[who]);
      d.unit[who] = b.dataset.u;
      input.value = fromMan(man, d.unit[who]);
      $$('button', seg).forEach(x => x.classList.toggle('on', x.dataset.u === d.unit[who]));
      upd();
    });
  });

  let delArmed = false;
  if (d.editing) {
    $('#nwDel').addEventListener('click', async (e) => {
      if (!delArmed) {
        delArmed = true;
        e.target.classList.add('confirm');
        e.target.textContent = '정말 삭제할까요?';
        return;
      }
      const target = draft.nw.month;
      try {
        await del('netWorth/' + target);
        delete ST.netWorth[target];
        closeSheet(); render.sameTab = true; render(); toast('삭제했어요');
      } catch (err) { toast('삭제하지 못했어요'); }
    });
  }

  $('#nwSave').addEventListener('click', async () => {
    const m = ($('#nwYear').value || '') + '-' + ($('#nwMon').value || '');
    if (!/^\d{4}-\d{2}$/.test(m)) { toast('년-월을 선택해 주세요'); return; }
    const s = toMan($('#nwSeeun').value, d.unit.seeun) ?? 0;
    const c = toMan($('#nwChankyu').value, d.unit.chankyu) ?? 0;
    const memo = $('#nwMemo').value.trim();
    const prev = ST.netWorth[m];
    if (prev && m !== draft.nw.month) { toast('그 달 기록이 이미 있어요'); return; }
    const rec = { seeun: s, chankyu: c, memo: memo || null, updatedAt: Date.now() };
    ST.netWorth[m] = rec;
    closeSheet(); go('networth'); render.sameTab = true; render();
    try { await put('netWorth/' + m, rec); toast(monthLabel(m) + ' 순자산을 저장했어요'); }
    catch (err) { if (!prev) delete ST.netWorth[m]; else ST.netWorth[m] = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); }
  });
}

/* ---------- 로드맵 수정 시트 ---------- */
const ROAD_FIELDS = [
  { k: 'goal_seeun', label: '세은 올해 목표', type: 'text' },
  { k: 'goal_chankyu', label: '찬규 올해 목표', type: 'text' },
  { k: 'age_seeun', label: '세은 만나이', type: 'number' },
  { k: 'age_chankyu', label: '찬규 만나이', type: 'number' },
  { k: 'buy', label: '매수', type: 'text' },
  { k: 'sell', label: '매도', type: 'text' },
  { k: 'taxfree', label: '비과세', type: 'text' },
  { k: 'plan', label: '매수방안', type: 'textarea' },
  { k: 'cashflow', label: '월급외', type: 'text' },
  { k: 'salary_seeun', label: '세은 월급 (만원)', type: 'number' },
  { k: 'salary_chankyu', label: '찬규 월급 (만원)', type: 'number' },
  { k: 'saving', label: '저축 여력 (백만원)', type: 'number' },
  { k: 'live', label: '거주', type: 'text' },
  { k: 'life', label: '생활', type: 'text' },
  { k: 'memo', label: '메모', type: 'textarea' }
];
function openRoadSheet(year) {
  const cur = ST.roadmap[year] || {};
  draft.road = { year, base: { ...cur } };
  const body = ROAD_FIELDS.map(f => {
    const val = cur[f.k] == null ? '' : cur[f.k];
    const id = 'rd_' + f.k;
    const input = f.type === 'textarea'
      ? '<textarea class="inp" id="' + id + '">' + esc(val) + '</textarea>'
      : '<input class="inp" type="' + f.type + '" ' + (f.type === 'number' ? 'inputmode="numeric"' : '') + ' id="' + id + '" value="' + esc(val) + '">';
    return '<label class="fld"><span>' + esc(f.label) + '</span>' + input + '</label>';
  }).join('');
  openSheet(year + '년 수정', body, '<button class="sh-save" id="rdSave">저장</button>');
  $('#rdSave').addEventListener('click', async () => {
    const next = { ...draft.road.base };
    ROAD_FIELDS.forEach(f => {
      const raw = ($('#rd_' + f.k) || {}).value;
      const v = raw == null ? '' : String(raw).trim();
      if (!v) { if (f.type !== 'number') next[f.k] = null; else next[f.k] = null; return; }
      next[f.k] = f.type === 'number' ? (Number(v) || 0) : v;
    });
    next.updatedAt = Date.now();
    ST.roadmap[year] = next;
    OPEN_YEARS.add(year);
    closeSheet(); render.sameTab = true; render();
    try { await put('roadmap/' + year, next); toast(year + '년 내용을 저장했어요'); }
    catch (err) { ST.roadmap[year] = draft.road.base; render.sameTab = true; render(); toast('저장하지 못했어요'); }
  });
}

/* ---------- 목표/확언 시트 ---------- */
function openGoalSheet(kind, id) {
  const cur = ST[kind][id]; if (!cur) return;
  draft.goal = { kind, id, base: { ...cur } };
  const body =
    '<label class="fld"><span>내용</span><textarea class="inp" id="gText" style="min-height:90px">' + esc(cur.text || '') + '</textarea></label>' +
    '<label class="fld"><span>메모 (선택)</span><textarea class="inp" id="gMemo">' + esc(cur.memo || '') + '</textarea></label>';
  openSheet(kind === 'goals' ? '목표 수정' : '확언 수정', body, '<button class="sh-save" id="gSave">저장</button>');
  $('#gSave').addEventListener('click', async () => {
    const text = $('#gText').value.trim();
    if (!text) { toast('내용을 적어 주세요'); return; }
    const memo = $('#gMemo').value.trim();
    const next = { ...draft.goal.base, text, memo: memo || null, updatedAt: Date.now() };
    ST[kind][id] = next;
    closeSheet(); render.sameTab = true; render();
    try { await patch(kind + '/' + id, { text, memo: memo || null, updatedAt: next.updatedAt }); toast('저장했어요'); }
    catch (err) { ST[kind][id] = draft.goal.base; render.sameTab = true; render(); toast('저장하지 못했어요'); }
  });
}

/* ============================================================
   시작
   ============================================================ */
function enter(room) {
  ROOM = room;
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  setLive('connecting');
  syncNow(true);
  connect();
  render.sameTab = false; render();
  window.addEventListener('online', () => { syncNow(true); if (!es) connect(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { syncNow(true); if (!es) connect(); }
  });
}
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.h === VERIFY_HEX && ROOM_KEY_RE.test(saved.room || '')) {
    enter(saved.room);
  } else {
    paintPins();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
