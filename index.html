  const top = '<section class="card">' +
    '<div class="card-h"><h2>📘 부부데이지 마스터 플랜</h2>' +
      (chs.length ? '<span class="pill navy">' + chs.length + '장</span>' : '') + '</div>' +
    (chs.length
      ? '<p class="pl-intro">브랜드 · 콘텐츠 · 채널 · 사업 구상 · 확정 전 항목을 한 장씩 모았어요. 항목을 눌러 바로 고칠 수 있어요.</p>' +
        '<div class="pl-count"><span class="pill">' + planCount() + '개 항목</span>' +
        '<span class="pill">확정 전은 구상 표시</span></div>'
      : '<p class="empty">플랜 데이터를 기다리고 있어요</p>') +
    '</section>';
  if (!chs.length) return top;
  const cards = chs.map(ch => {
    const secs = planSections(ch);
    const body = secs.length ? '<div class="pl-secs">' + secs.map(sec => {
      const its = planItems(sec);
      return '<div class="pl-sec">' +
        (sec.name ? '<div class="pl-sec-h">' + esc(sec.name) + '</div>' : '') +
        its.map(it => planItemRow(ch.id, sec.id, it)).join('') +
        '<button class="add-row" data-act="pl-add" data-c="' + esc(ch.id) + '" data-s="' + esc(sec.id) + '">＋ 항목 추가</button>' +
        '</div>';
    }).join('') + '</div>' : '<p class="empty">아직 섹션이 없어요</p>';
    return '<section class="card">' +
      '<div class="card-h"><h2>' + (ch.emoji ? esc(ch.emoji) + ' ' : '') + esc(ch.title || '플랜') + '</h2>' +
        '<button class="pen-btn" data-act="pl-ch" data-c="' + esc(ch.id) + '" aria-label="챕터 수정">✏️</button></div>' +
      (ch.intro ? '<p class="pl-intro">' + esc(ch.intro) + '</p>' : '') +
      body +
      '</section>';
  }).join('');
  return top + cards + '<p class="foot-note">항목을 누르면 고칠 수 있어요 · 아직 확정 전인 내용은 <b>구상</b>으로 표시돼요</p>';
}

function nextPlanOrder(sec) {
  let max = 0;
  planItems(sec).forEach(x => { const n = num(x.order); if (n !== null && n > max) max = n; });
  return max + 1;
}
function openPlanItemSheet(cid, sid, iid) {
  const ch = planRoot()[cid];
  if (!ch) return;
  const secs = planSections({ id: cid, ...ch });
  const sec = (ch.sections && ch.sections[sid]) ? ch.sections[sid] : null;
  if (!sec) return;
  const isNew = !iid;
  const cur = isNew ? null : ((sec.items && sec.items[iid]) || null);
  if (!isNew && !cur) return;
  const seed = cur || { label: '', value: '', note: '', draft: false };
  const body =
    '<label class="fld"><span>구분 (선택 · 예: 인스타그램)</span>' +
      '<input class="inp" id="plLabel" value="' + esc(seed.label || '') + '"></label>' +
    '<label class="fld"><span>내용</span>' +
      '<textarea class="inp" id="plValue" style="min-height:88px">' + esc(seed.value || '') + '</textarea></label>' +
    '<label class="fld"><span>설명 (선택)</span>' +
      '<textarea class="inp" id="plNote">' + esc(seed.note || '') + '</textarea></label>' +
    (secs.length > 1
      ? '<label class="fld"><span>위치</span><select class="inp" id="plSec">' + secs.map(s =>
          '<option value="' + esc(s.id) + '"' + (s.id === sid ? ' selected' : '') + '>' +
          esc(s.name || '기타') + '</option>').join('') + '</select></label>'
      : '') +
    '<label class="pl-check"><input type="checkbox" id="plDraft"' + (seed.draft ? ' checked' : '') +
      '><span>아직 확정 전이에요 (구상 표시)</span></label>' +
    '<p class="hint-in">내용은 두 분 폰에 바로 반영돼요. 위치를 바꾸면 다른 섹션으로 옮겨가요.</p>';
  const acts = '<button class="sh-save" id="plSave">' + (isNew ? '추가' : '저장') + '</button>' +
    (isNew ? '' : '<button class="sh-del" id="plDel">삭제</button>');
  openSheet(isNew ? '플랜 항목 추가' : '플랜 항목 수정', body, acts);

  $('#plSave').addEventListener('click', async () => {
    const value = $('#plValue').value.trim();
    if (!value) { toast('내용을 적어 주세요'); return; }
    const label = $('#plLabel').value.trim();
    const note = $('#plNote').value.trim();
    const draftOn = !!$('#plDraft').checked;
    const targetSid = ($('#plSec') ? $('#plSec').value : sid) || sid;
    const tSec = (ch.sections && ch.sections[targetSid]) || null;
    if (!tSec) { toast('위치를 확인해 주세요'); return; }
    if (!tSec.items) tSec.items = {};
    const key2 = isNew ? newKey('p') : iid;
    const order = (isNew || targetSid !== sid) ? nextPlanOrder(tSec) : plOrder(seed.order, 1);
    const rec = { label: label || null, value: value, note: note || null,
      draft: draftOn, order: order, updatedAt: Date.now() };
    const prev = JSON.parse(JSON.stringify(ST.plan || {}));
    tSec.items[key2] = rec;
    if (!isNew && targetSid !== sid) delete ch.sections[sid].items[iid];
    closeSheet(); render.sameTab = true; render();
    try {
      await put('masterPlan/chapters/' + cid + '/sections/' + targetSid + '/items/' + key2, rec);
      if (!isNew && targetSid !== sid) await del('masterPlan/chapters/' + cid + '/sections/' + sid + '/items/' + iid);
      toast(isNew ? '항목을 추가했어요' : '저장했어요');
    } catch (e) {
      ST.plan = prev; render.sameTab = true; render(); toast('저장하지 못했어요');
    }
  });
  if (!isNew) $('#plDel').addEventListener('click', async (e) => {
    if (!delArm(e.currentTarget)) return;
    const prev = JSON.parse(JSON.stringify(ST.plan || {}));
    delete ch.sections[sid].items[iid];
    closeSheet(); render.sameTab = true; render();
    try { await del('masterPlan/chapters/' + cid + '/sections/' + sid + '/items/' + iid); toast('삭제했어요'); }
    catch (err) { ST.plan = prev; render.sameTab = true; render(); toast('삭제하지 못했어요'); }
  });
}
function openPlanChapterSheet(cid) {
  const ch = planRoot()[cid];
  if (!ch) return;
  const body =
    '<div class="fld"><span>아이콘 · 제목</span><div class="ym-row">' +
      '<input class="inp" id="plxEmoji" style="text-align:center" maxlength="12" value="' + esc(ch.emoji || '') + '" placeholder="📘">' +
      '<input class="inp" id="plxTitle" value="' + esc(ch.title || '') + '" placeholder="챕터 제목">' +
    '</div></div>' +
    '<label class="fld"><span>맨 위 설명 (선택)</span>' +
      '<textarea class="inp" id="plxIntro" style="min-height:88px">' + esc(ch.intro || '') + '</textarea></label>' +
    '<p class="hint-in">항목은 각 섹션 아래 「＋ 항목 추가」로 더하고, 항목을 누르면 고칠 수 있어요.</p>';
  openSheet('챕터 수정', body, '<button class="sh-save" id="plxSave">저장</button>');
  $('#plxSave').addEventListener('click', async () => {
    const title = $('#plxTitle').value.trim();
    if (!title) { toast('제목을 적어 주세요'); return; }
    const emoji = $('#plxEmoji').value.trim();
    const intro = $('#plxIntro').value.trim();
    const prev = JSON.parse(JSON.stringify(ST.plan || {}));
    const base = { ...ch };
    ch.emoji = emoji || null; ch.title = title; ch.intro = intro || null; ch.updatedAt = Date.now();
    closeSheet(); render.sameTab = true; render();
    try {
      await patch('masterPlan/chapters/' + cid, { emoji: emoji || null, title: title, intro: intro || null, updatedAt: Date.now() });
      toast('챕터를 저장했어요');
    } catch (e) {
      ST.plan.chapters[cid] = base; render.sameTab = true; render(); toast('저장하지 못했어요');
    }
  });
}

/* ============================================================
   📝 수정 요청 메모 (이 기기에만 저장 · 탭 이동해도 유지)
   ============================================================ */
const MEMO_KEY = 'bubudaisy.memos';
const TAB_NAMES = {
  vision: '비전', strategy: '전략', networth: '순자산'
};
let MEMOS = loadMemos();
function loadMemos() {
  try {
    const a = JSON.parse(localStorage.getItem(MEMO_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => x && x.text) : [];
  } catch (e) { return []; }
}
function saveMemos() {
  try { localStorage.setItem(MEMO_KEY, JSON.stringify(MEMOS)); } catch (e) {}
  paintMemoBadge();
}
function memoTabName(t) { return TAB_NAMES[t] || '기타'; }
function paintMemoBadge() {
  const b = $('#memoBtn'), c = $('#memoCnt');
  if (!b || !c) return;
  const n = MEMOS.length;
  b.classList.toggle('has', n > 0);
  c.textContent = n > 9 ? '9+' : String(n);
  c.classList.toggle('hidden', n === 0);
  b.setAttribute('aria-label', n ? '수정 요청 메모 ' + n + '개' : '수정 요청 메모');
}
function memoRows() {
  if (!MEMOS.length) return '<p class="empty">아직 적어 둔 요청이 없어요<br>고치고 싶은 곳을 그때그때 적어 두세요 🌼</p>';
  return MEMOS.map(m =>
    '<div class="memo-row"><span class="mt">' + esc(m.tab || '기타') + '</span>' +
    '<span class="mx">' + esc(m.text) + '</span>' +
    '<button class="memo-del" data-mdel="' + esc(m.id) + '" aria-label="삭제">✕</button></div>').join('');
}
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (!ok) throw new Error('copy failed');
}
function openMemoSheet() {
  const body =
    '<div class="fld"><span>요청 내용 · 지금 탭 [' + esc(memoTabName(ST.tab)) + ']</span>' +
      '<textarea class="inp" id="memoText" style="min-height:78px" placeholder="예: 순자산 탭 글자가 조금 작아요"></textarea></div>' +
    '<button class="add-row" id="memoAdd">＋ 메모 추가</button>' +
    '<div class="memo-list" id="memoList">' + memoRows() + '</div>' +
    '<p class="hint-in">탭 이름이 앞에 자동으로 붙어요. 메모는 이 기기에만 저장되고, 탭을 옮겨도 그대로 남아요.</p>';
  const acts =
    '<button class="sh-save" id="memoCopy">📋 전체 복사</button>' +
    '<button class="sh-del" id="memoClear">🗑 목록 비우기</button>';
  openSheet('📝 두두에게 보낼 수정 요청', body, acts);

  const inp = $('#memoText');
  const addMemo = () => {
    const v = inp.value.trim();
    if (!v) { toast('요청 내용을 적어 주세요'); inp.focus(); return; }
    MEMOS.push({ id: newKey('m'), tab: memoTabName(ST.tab), text: v, at: Date.now() });
    saveMemos();
    inp.value = '';
    $('#memoList').innerHTML = memoRows();
    toast('메모를 추가했어요');
    inp.focus();
  };
  $('#memoAdd').addEventListener('click', addMemo);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMemo(); }
  });
  $('#memoList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mdel]');
    if (!b) return;
    MEMOS = MEMOS.filter(x => x.id !== b.dataset.mdel);
    saveMemos();
    $('#memoList').innerHTML = memoRows();
  });
  $('#memoCopy').addEventListener('click', async () => {
    if (!MEMOS.length) { toast('복사할 메모가 없어요'); return; }
    const text = 'BUBUDAISY 수정 요청:\n' +
      MEMOS.map(m => '- [' + (m.tab || '기타') + '] ' + m.text).join('\n');
    try { await copyText(text); toast('복사됐어요! 피클 채팅에 붙여넣어 주세요'); }
    catch (e) { toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요'); }
  });
  $('#memoClear').addEventListener('click', (e) => {
    if (!MEMOS.length) { toast('비울 메모가 없어요'); return; }
    const btn = e.currentTarget;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.classList.add('confirm');
      btn.textContent = '정말 비울까요?';
      return;
    }
    MEMOS = [];
    saveMemos();
    $('#memoList').innerHTML = memoRows();
    btn.dataset.armed = '';
    btn.classList.remove('confirm');
    btn.textContent = '🗑 목록 비우기';
    toast('메모를 모두 지웠어요');
  });
}
$('#memoBtn').addEventListener('click', openMemoSheet);
paintMemoBadge();

/* ============================================================
   시작
   ============================================================ */
function enter(room) {
  ROOM = room;
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  setLive('connecting');
  syncNow(true);
  connect();
  render.sameTab = false; render();
  window.addEventListener('online', () => { syncNow(true); if (!es) connect(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { syncNow(true); if (!es) connect(); }
  });
}
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.h === VERIFY_HEX && ROOM_KEY_RE.test(saved.room || '')) {
    enter(saved.room);
  } else {
    paintPins();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
