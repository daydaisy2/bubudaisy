<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUBUDAISY</title>
<meta name="description" content="BUBUDAISY — 두 사람만의 비전·순자산 보드">
<meta name="theme-color" content="#FBE049">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BUBUDAISY">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --yellow:#FBE049;
    --yellow-deep:#F1D22F;
    --white:#FFFFFF;
    --cream:#FDF8E7;
    --cream-line:#F3ECD6;
    --navy:#1E1B7A;
    --navy-2:#2A2694;
    --green:#2F8F52;
    --green-soft:#E4F3E1;
    --ink:#20201C;
    --muted:#8A8674;
    --r:26px;
    --shadow:0 10px 24px rgba(112,86,0,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--yellow);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ================= 잠금 화면 ================= */
  #lock{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:var(--yellow);z-index:60}
  .lock-card{width:100%;max-width:344px;background:var(--white);border-radius:var(--r);
    padding:26px 22px 20px;text-align:center;box-shadow:0 18px 44px rgba(112,86,0,.20)}
  .lock-fl{font-size:42px;line-height:1}
  .lock-title{margin:6px 0 0;font-size:27px;font-weight:900;letter-spacing:-.03em;color:var(--navy);line-height:1.1}
  .lock-tag{margin:7px 0 0;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.01em}
  .lock-badge{display:inline-block;margin:14px 0 0;padding:5px 11px;border-radius:999px;
    background:var(--cream);color:#7C765C;font-size:11.5px;font-weight:800}
  .pin-dots{display:flex;justify-content:center;gap:13px;margin:20px 0 2px;height:16px}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#EDE7D1;transition:transform .12s,background .12s}
  .pin-dot.on{background:var(--navy);transform:scale(1.06)}
  .pin-msg{margin:10px 0 0;min-height:16px;font-size:12px;font-weight:800;color:#C0392B}
  .pin-msg.ok{color:var(--green)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
  .key{height:52px;border-radius:17px;background:var(--cream);color:var(--navy);
    font-size:22px;font-weight:800;letter-spacing:.02em;transition:transform .1s,background .15s}
  .key:active{transform:scale(.95);background:#F6EFD6}
  .key.ghost{background:transparent;color:var(--muted);font-size:17px}
  .lock-foot{margin:14px 0 0;font-size:11px;font-weight:700;color:#A9A48D;line-height:1.5}
  .shake{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ================= 앱 틀 ================= */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 8px}
  .brand{display:flex;align-items:center;gap:.28em;margin:0;font-size:23px;font-weight:900;
    letter-spacing:-.035em;color:var(--navy);line-height:1}
  .brand .fl{font-size:20px;transform:translateY(1px)}
  .top-right{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#BDB79B;transition:background .3s}
  .dot.live{background:var(--green)}
  .dot.warn{background:#D08A17}
  .dot.off{background:#A9A497}
  .lock-btn{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.55);font-size:14px;color:var(--navy)}
  .memo-btn{position:relative;width:32px;height:32px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.55);font-size:14px;color:var(--navy);transition:background .18s,color .18s}
  .memo-btn.has{background:var(--navy);color:#fff}
  .memo-cnt{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
    background:#E8603C;color:#fff;font-size:9px;font-weight:900;line-height:16px;text-align:center;
    border:1.5px solid var(--yellow)}
  #view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:2px 16px 20px;display:flex;flex-direction:column;gap:13px;scrollbar-width:none}
  #view > *{flex:0 0 auto}
  #view::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(112,86,0,.12)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:16px;
    font-size:11px;font-weight:800;color:#8F8A73;letter-spacing:-.02em;transition:background .18s,color .18s}
  .tab .ic{font-size:17px;line-height:1;opacity:.55;transition:opacity .18s}
  .tab.on{color:var(--navy);background:var(--white);box-shadow:0 3px 10px rgba(112,86,0,.13)}
  .tab.on .ic{opacity:1}

  /* ================= 카드 ================= */
  .card{background:var(--white);border-radius:var(--r);padding:15px 16px 13px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-h h2{margin:0;font-size:14.5px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .pill{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#7C765C;background:var(--cream);
    padding:4px 9px;border-radius:999px;letter-spacing:-.02em}
  .pill.navy{color:#fff;background:var(--navy)}
  .pill.green{color:#fff;background:var(--green)}
  .hero{background:linear-gradient(155deg,#2B2799,#1E1B7A 62%);color:#fff;border-radius:var(--r);
    padding:16px 17px 15px;box-shadow:0 14px 28px rgba(30,27,122,.28);display:flex;flex-direction:column;gap:7px}
  .hero-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#CFCBF3;letter-spacing:-.01em}
  .hero-main{font-size:17px;font-weight:900;letter-spacing:-.035em;line-height:1.32}
  .hero-main b{color:#FFE680}
  .hero-sub{font-size:12.5px;font-weight:800;color:#D9D6F8}
  .big{font-size:26px;font-weight:900;letter-spacing:-.04em;color:var(--navy);line-height:1.1}
  .big small{font-size:13px;font-weight:800;color:var(--muted);margin-left:5px;letter-spacing:-.02em}
  .big-none{font-size:19px;font-weight:900;color:#B4AE97;letter-spacing:-.03em}
  .bar{height:9px;border-radius:999px;background:#EFEAD6;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--navy);width:0;
    transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar.green i{background:var(--green)}
  .bar-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:-.02em}
  .bar-meta b{color:var(--navy)}
  .rowline{display:flex;align-items:center;gap:9px;background:var(--cream);border-radius:14px;
    padding:10px 12px;font-size:12.5px;font-weight:700;letter-spacing:-.02em;line-height:1.45;color:#3A382E}
  .rowline .k{flex:0 0 auto;font-weight:900;color:#6E6851;font-size:11.5px}
  .rowline .v{flex:1 1 auto;min-width:0}
  .rowline .v b{color:var(--navy);font-weight:900}
  .rowline.green{background:var(--green-soft);color:#22502D}
  .rowline.green .v b{color:var(--green)}
  .checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .checks li{display:flex;gap:8px;align-items:flex-start;background:var(--cream);border-radius:14px;
    padding:9px 12px;font-size:12.5px;font-weight:700;color:#3A382E;letter-spacing:-.02em;line-height:1.45}
  .checks li .tk{flex:0 0 auto;color:var(--green);font-weight:900;font-size:12px;line-height:1.5}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .steps li{display:flex;gap:9px;align-items:flex-start;background:var(--cream);border-radius:14px;padding:9px 12px}
  .steps .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;
    font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:1px}
  .steps .t{display:block;font-size:12.5px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.4}
  .steps .d{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:-.02em;line-height:1.4}
  .cap{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:-.02em}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .chip{background:var(--cream);border-radius:14px;padding:11px 6px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:11px;font-weight:900;color:#4A4738;letter-spacing:-.02em}
  .chip .ci{font-size:18px;line-height:1}
  .ms{display:flex;flex-direction:column;gap:8px}
  .ms-card{border-radius:16px;background:var(--cream);padding:11px 11px 11px;transition:background .15s}
  .ms-card:active{background:#F6EFD6}
  .ms-card.green:active{background:#E4F3E1}
  .ms-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding:0 2px}
  .ms-h .y{font-size:15px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
  .ms-h .y.green{color:var(--green)}
  .ms-h .bd{font-size:10px;font-weight:900;color:#7C765C;background:#fff;padding:3px 8px;border-radius:999px}
  .ms-card.green .ms-h .bd{color:#2A6E3C}
  .ms-hr{display:flex;align-items:center;gap:6px;min-width:0}
  .ms-hr .li-chev{padding-left:0}
  .ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .ms-box{background:#fff;border-radius:12px;min-height:52px;padding:8px 6px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:11px;font-weight:900;color:#3A382E;letter-spacing:-.03em;line-height:1.32;
    transition:background .15s}
  .ms-box:active{background:#F6EFD6}
  .ms-card.green .ms-box{background:var(--green-soft);color:#265C33}
  .ms-in3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .ms-in3 label{display:flex;flex-direction:column;gap:3px;min-width:0}
  .ms-in3 i{font-style:normal;font-size:10px;font-weight:900;color:#9A947C;letter-spacing:-.01em;padding-left:3px}
  .ms-in3 .inp{padding:11px 8px;font-size:12.5px;font-weight:800;text-align:center}
  .ms-prev{background:var(--cream);border-radius:14px;padding:8px}
  .ms-prev .ms-box{min-height:44px;font-size:10.5px}
  .foot-note{margin:2px 4px 6px;font-size:10.5px;font-weight:700;color:#7E7448;text-align:center;letter-spacing:-.02em}

  /* ================= 비전 탭 직접 편집 ================= */
  .pen-btn{flex:0 0 auto;width:28px;height:28px;border-radius:10px;background:var(--cream);
    color:#7C765C;font-size:12px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .15s}
  .pen-btn:active{transform:scale(.94);background:#F6EFD6}
  .board-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .hero-tap{cursor:pointer}
  .hero-top .pen-btn{margin-left:auto;background:rgba(255,255,255,.17);color:#fff}
  /* 통합 목표 카드 */
  .goalcard{gap:9px}
  .grows{display:flex;flex-direction:column;gap:6px}
  .grow{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
    background:rgba(255,255,255,.10);border-radius:15px;padding:10px 11px;transition:background .15s}
  .grow:active{background:rgba(255,255,255,.18)}
  .grow .gn{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:#FFE680;color:#2A2694;
    font-size:10.5px;font-weight:900;display:grid;place-items:center;margin-top:1px}
  .grow .gt{flex:1 1 auto;min-width:0;display:block}
  .grow .gl{display:block;font-size:10px;font-weight:900;color:#C6C2F2;letter-spacing:-.01em}
  .grow .gv{display:block;font-size:13.5px;font-weight:900;color:#fff;letter-spacing:-.03em;
    line-height:1.32;margin-top:1px}
  .grow .gsub{display:block;font-size:10.5px;font-weight:700;color:#B6B1EE;letter-spacing:-.02em;
    line-height:1.4;margin-top:3px}
  .grow .gchev{flex:0 0 auto;align-self:center;color:rgba(255,255,255,.45);font-size:12px}
  /* 비전 탭은 보기 전용 — 순자산 목표 줄 오른쪽의 현재 순자산 뱃지 */
  .grow.ro{cursor:default}
  .grow.ro:active{background:rgba(255,255,255,.10)}
  .nwpill{flex:0 0 auto;align-self:center;display:inline-flex;align-items:baseline;gap:4px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);border-radius:999px;
    padding:5px 9px;font-size:10px;font-weight:900;color:#D6D3F7;letter-spacing:-.02em;white-space:nowrap}
  .nwpill .v{font-size:11.5px;font-weight:900;color:#FFE680;letter-spacing:-.03em}
  .nwpill.none{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);color:#B6B1EE}
  .nwpill.none .v{color:#CFCBF3;font-size:11px}
  /* 목표 카드 1·2·3번 오른쪽 '현재' 뱃지 — 세 줄 폭·높이를 같게(폭은 스크립트가 가장 넓은 뱃지에 맞춤),
     안쪽은 왼쪽 정렬이라 세 줄의 '현재' 글자 시작선이 세로로 일직선이 된다 */
  .goalcard .grow{align-items:center;gap:8px;min-height:48px}
  .goalcard .gv{font-size:12px}
  .goalcard .nwpill{justify-content:flex-start;text-align:left}
  @media (min-width:400px){
    .goalcard .gv{font-size:13.5px}
  }
  @media (max-width:379px){
    .goalcard .grow{padding:9px;gap:6px;min-height:46px}
    .goalcard .gv{font-size:11px}
    .goalcard .nwpill{font-size:9.5px;padding:5px 7px}
    .goalcard .nwpill .v{font-size:10.5px}
  }
  .gadd{width:100%;min-height:36px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.26);
    color:#CCC8F2;font-size:11.5px;font-weight:900;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .gadd:active{background:rgba(255,255,255,.10)}
  .tap{cursor:pointer}
  .li-chev{flex:0 0 auto;align-self:center;margin-left:auto;padding-left:4px;
    color:#C6BFA6;font-size:13px;line-height:1}
  .add-row{width:100%;min-height:38px;border-radius:13px;border:1.5px dashed var(--cream-line);
    color:#8F8A73;font-size:11.5px;font-weight:900;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s}
  .add-row:active{background:var(--cream)}
  .capbtn{width:100%;display:block;text-align:center}
  .hint{margin:-5px 4px 0;font-size:10.5px;font-weight:800;color:#6F6437;
    text-align:center;letter-spacing:-.02em;line-height:1.45}
  .foot-btn{font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit}
  .rows{display:flex;flex-direction:column;gap:7px}
  .row-edit{display:flex;gap:6px;align-items:stretch}
  .row-edit .inp{flex:1 1 0;min-width:0;font-size:13px;padding:10px 10px}
  .row-del{flex:0 0 auto;width:34px;border-radius:12px;background:#FBEAE7;color:#C0392B;
    font-size:14px;display:grid;place-items:center}
  .seg2{display:flex;background:var(--cream);border-radius:12px;padding:3px;gap:3px}
  .seg2 button{flex:1 1 0;padding:9px 6px;border-radius:9px;font-size:11.5px;
    font-weight:900;color:#8A8674;letter-spacing:-.02em}
  .seg2 button.on{background:var(--navy);color:#fff}
  .hint-in{font-size:10.5px;font-weight:800;color:#9A947C;letter-spacing:-.02em;
    line-height:1.5;padding-left:2px}

  /* ================= 비전 · 🔄 갈아타기 전략 카드 ================= */
  .flow4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .flow4.c4{grid-template-columns:repeat(3,1fr) 1.45fr}
  .flow4.c3{grid-template-columns:repeat(3,1fr)}
  .flow4.c2{grid-template-columns:repeat(2,1fr)}
  .flow-step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;
    background:var(--cream);border:1.5px solid var(--cream-line);border-radius:16px;
    padding:9px 4px 10px;transition:background .15s,border-color .15s}
  .flow-step:active{background:#F6EFD6;border-color:#E7DDBC}
  .fs-badge{max-width:100%;font-size:9.5px;font-weight:900;color:var(--navy);background:#fff;
    border-radius:999px;padding:3px 7px;line-height:1.3;letter-spacing:-.02em;
    text-align:center;overflow-wrap:anywhere}
  .fs-emoji{font-size:20px;line-height:1}
  .fs-label{font-size:10.5px;font-weight:900;color:var(--navy);text-align:center;line-height:1.28;
    letter-spacing:-.03em;overflow-wrap:anywhere}
  .flow-step.last{background:linear-gradient(160deg,#2E2AA0,#1E1B7A 72%);border-color:transparent;
    box-shadow:0 9px 18px rgba(30,27,122,.24)}
  .flow-step.last:active{background:linear-gradient(160deg,#3531AC,#242086 72%)}
  .flow-step.last .fs-badge{background:var(--yellow);color:#2A2694}
  .flow-step.last .fs-label{color:#fff;font-size:9.5px}
  .flow-down{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:20px;margin:-3px 0 -4px}
  .flow-down.c4{grid-template-columns:repeat(3,1fr) 1.45fr}
  .flow-down span{position:relative}
  .flow-down span.ln:before{content:'';position:absolute;left:50%;top:0;width:2px;height:13px;
    margin-left:-1px;background:var(--cream-line);border-radius:2px}
  .flow-down span.ln:after{content:'';position:absolute;left:50%;bottom:0;width:7px;height:7px;
    margin-left:-3.5px;border-right:2px solid #C6BFA6;border-bottom:2px solid #C6BFA6;
    transform:rotate(45deg)}
  .flow-way-h{display:flex;align-items:center;gap:8px}
  .flow-way-h:before,.flow-way-h:after{content:'';flex:1 1 auto;height:1px;background:var(--cream-line)}
  .flow-way-h span{flex:0 0 auto;font-size:10.5px;font-weight:900;color:var(--navy);
    background:var(--cream);border-radius:999px;padding:5px 10px;letter-spacing:-.02em;text-align:center}
  .flow-ways{display:flex;flex-direction:column;gap:6px}
  .way{width:100%;display:flex;flex-direction:column;gap:5px;text-align:left;
    background:var(--cream);border-radius:15px;padding:10px 11px;transition:background .15s}
  .way:active{background:#F6EFD6}
  .way-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .way-h b{font-size:12.5px;font-weight:900;color:var(--navy);letter-spacing:-.03em;line-height:1.35}
  .way-x{flex:0 0 auto;font-size:10px;opacity:.45;line-height:1}
  .way-d{font-size:11px;font-weight:800;color:#5A5647;letter-spacing:-.02em;line-height:1.45}
  .way-c{display:flex;align-items:flex-start;gap:5px;background:#FFF4D8;border-radius:10px;

'use strict';
/* ============================================================
   BUBUDAISY — 두 사람만의 비전·순자산 보드
   정적 코드에는 어떤 개인 데이터도 없다. 모든 내용은
   비밀번호에서 파생된 비공개 방(Firebase RTDB)에만 있다.
   ============================================================ */

/* ---------- 설정 ---------- */
const DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';
const PBKDF2_SALT = 'bubudaisy::v1';
const PBKDF2_ITER = 210000;
const VERIFY_HEX = 'c94584ef0ca10084ad0655e469418be1f0dad47b16e4762adc1d36b35c5144ec';
const AUTH_KEY = 'bubudaisy.auth';
const ROOM_KEY_RE = /^bubudaisy-[a-z0-9]{12,32}$/;

const TABS = ['vision', 'networth', 'goals', 'bucket', 'trade', 'plan'];

/* ---------- 도우미 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }
function fmtMan(v) {
  const n = num(v);
  if (n === null) return '—';
  const a = Math.abs(Math.round(n));
  const sign = n < 0 ? '-' : '';
  if (a >= 10000) {
    const eok = Math.floor(a / 10000), man = a % 10000;
    return sign + eok.toLocaleString('ko-KR') + '억' + (man ? ' ' + man.toLocaleString('ko-KR') + '만원' : '원');
  }
  return sign + a.toLocaleString('ko-KR') + '만원';
}
function fmtNum(v, unit) {
  const n = num(v);
  if (n === null) return '—';
  return Math.round(n).toLocaleString('ko-KR') + (unit || '');
}
function monthLabel(m) {
  const mm = /^(\d{4})-(\d{2})$/.exec(String(m || ''));
  return mm ? mm[1] + '.' + mm[2] : String(m || '');
}
function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.remove(), 2200);
}
function entries(obj) {
  return Object.entries(obj || {}).filter(([, v]) => v && typeof v === 'object');
}
function hex(buf) {
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const pin = { buf: '' };

function paintPins() {
  $$('#pinDots .pin-dot').forEach((d, i) => d.classList.toggle('on', i < pin.buf.length));
}
async function derive(pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(PBKDF2_SALT), iterations: PBKDF2_ITER, hash: 'SHA-256' },
    key, 512);
  return hex(bits);
}
let checking = false;
async function tryUnlock() {
  if (checking) return;
  checking = true;
  const msg = $('#pinMsg');
  msg.className = 'pin-msg'; msg.textContent = '확인 중…';
  try {
    if (!(window.crypto && crypto.subtle)) {
      msg.textContent = '보안 연결(https)에서 열어 주세요';
      checking = false; return;
    }
    const bits = await derive(pin.buf);
    if (bits.slice(0, 64) !== VERIFY_HEX) {
      msg.textContent = '비밀번호가 맞지 않아요';
      const card = $('#lockCard');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      pin.buf = ''; paintPins();
      checking = false; return;
    }
    const room = 'bubudaisy-' + bits.slice(64, 84);
    localStorage.setItem(AUTH_KEY, JSON.stringify({ h: VERIFY_HEX, room, at: Date.now() }));
    msg.className = 'pin-msg ok'; msg.textContent = '열리는 중…';
    enter(room);
  } catch (e) {
    msg.textContent = '잠시 후 다시 시도해 주세요';
  }
  checking = false;
}
function pushKey(k) {
  const msg = $('#pinMsg');
  if (msg.textContent) { msg.textContent = ''; msg.className = 'pin-msg'; }
  if (k === 'del') { pin.buf = pin.buf.slice(0, -1); paintPins(); return; }
  if (k === 'clear') { pin.buf = ''; paintPins(); return; }
  if (pin.buf.length >= 6) return;
  pin.buf += k;
  paintPins();
  if (pin.buf.length === 6) setTimeout(tryUnlock, 110);
}
$('#pad').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]');
  if (b) pushKey(b.dataset.k);
});
document.addEventListener('keydown', (e) => {
  if ($('#lock').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) pushKey(e.key);
  else if (e.key === 'Backspace') pushKey('del');
  else if (e.key === 'Enter' && pin.buf.length === 6) tryUnlock();
});

}

const roomUrl = () => DB + '/rooms/' + ROOM + '.json';
const nodeUrl = (p) => DB + '/rooms/' + ROOM + '/' + p + '.json';

function setLive(state) {
  const el = $('#dot'); if (!el) return;
  el.className = 'dot ' + state;
  el.title = state === 'live' ? '실시간 연결됨' : state === 'warn' ? '다시 연결 중' : state === 'off' ? '오프라인' : '연결 중';
}
function absorb(d) {
  d = d || {};
  const v = d.vision && typeof d.vision === 'object' ? d.vision : null;
  if (v) {
    // 배열/숫자 정규화
    if (Array.isArray(v.strategy)) v.strategy = v.strategy.filter(Boolean);
    if (Array.isArray(v.pledge)) v.pledge = v.pledge.filter(Boolean);
    if (Array.isArray(v.milestones)) v.milestones = v.milestones.filter(Boolean);
    if (Array.isArray(v.expertise)) v.expertise = v.expertise.filter(Boolean);
    if (v.goal && Array.isArray(v.goal.items)) v.goal.items = v.goal.items.filter(Boolean);
    if (v.roadmapFlow && typeof v.roadmapFlow === 'object') {
      if (Array.isArray(v.roadmapFlow.steps)) v.roadmapFlow.steps = v.roadmapFlow.steps.filter(Boolean);
      if (Array.isArray(v.roadmapFlow.ways)) v.roadmapFlow.ways = v.roadmapFlow.ways.filter(Boolean);
    }
  }
  ST.vision = v;
  ST.netWorth = d.netWorth || {};
  ST.roadmap = d.roadmap || {};
  ST.goals = d.goals || {};
  ST.affirmations = d.affirmations || {};
  ST.bucket = (d.bucket && typeof d.bucket === 'object') ? d.bucket : {};
  ST.tradeUp = (d.tradeUpStrategies && typeof d.tradeUpStrategies === 'object') ? d.tradeUpStrategies : {};
  ST.plan = (d.masterPlan && typeof d.masterPlan === 'object') ? d.masterPlan : {};
  ST.loaded = true;
}
async function syncNow(quiet) {
  try {
    const r = await fetch(roomUrl(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    absorb(await r.json());
    if (!es) setLive('live');
    render(); stopPolling();
  } catch (e) {
    if (!quiet) toast('연결을 확인해 주세요');
    setLive(navigator.onLine ? 'warn' : 'off');
  }
}
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => { if (!es) syncNow(true); }, 9000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function connect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  setLive(retry ? 'warn' : 'connecting');
  try { es = new EventSource(roomUrl()); } catch (e) { setLive('off'); return; }
  es.addEventListener('put', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    retry = 0; setLive('live'); stopPolling();
    if (m.path === '/' || m.path === '') { absorb(m.data); scheduleRender(); return; }
    const segs = m.path.split('/').filter(Boolean);
    if (segs.length === 1) { applyNode(segs[0], m.data); scheduleRender(); return; }
    syncNow(true);
  });
  es.addEventListener('patch', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    retry = 0; setLive('live'); stopPolling();
    const segs = (m.path === '/' ? '' : m.path).split('/').filter(Boolean);
    if (segs.length <= 1 && m.data && typeof m.data === 'object') {
      const root = segs.length ? segs[0] : '';
      Object.entries(m.data).forEach(([k, v]) => {
        if (!root) applyNode(k, v);
        else applyChild(root, k, v);
      });
      scheduleRender();
      return;
    }
    syncNow(true);
  });
  es.onopen = () => { retry = 0; setLive('live'); stopPolling(); };
  es.onerror = () => { setLive(navigator.onLine ? 'warn' : 'off'); reconnect(); startPolling(); };
}
const NODE_TO_ST = {
  netWorth: 'netWorth', roadmap: 'roadmap', goals: 'goals', affirmations: 'affirmations',
  bucket: 'bucket', tradeUpStrategies: 'tradeUp', masterPlan: 'plan'
};
function applyNode(name, data) {
  if (name === 'vision') {
    absorb({
      vision: data, netWorth: ST.netWorth, roadmap: ST.roadmap, goals: ST.goals,
      affirmations: ST.affirmations, bucket: ST.bucket, tradeUpStrategies: ST.tradeUp,
      masterPlan: ST.plan
    });
    return;
  }
  const k = NODE_TO_ST[name];
  if (k) ST[k] = (data && typeof data === 'object') ? data : {};
}
function applyChild(root, key, val) {
  const k = NODE_TO_ST[root];
  if (!k) return;
  if (!ST[k] || typeof ST[k] !== 'object') ST[k] = {};
  if (val === null || val === undefined) delete ST[k][key];
  else ST[k][key] = val;
}
function reconnect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  retry = Math.min(retry + 1, 6);
  const wait = Math.min(900 * Math.pow(1.7, retry), 15000);
  setTimeout(() => { if (!es) connect(); }, wait);
}
async function put(path, val) {
  const r = await fetch(nodeUrl(path), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
async function patch(path, val) {
  const r = await fetch(nodeUrl(path), {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}
async function del(path) {
  const r = await fetch(nodeUrl(path), { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

function nwSorted() {
  return entries(ST.netWorth)
    .map(([m, v]) => ({
      month: m,
      seeun: num(v.seeun) || 0,
      chankyu: num(v.chankyu) || 0,
      expense: num(v.expense) || 0,

      memo: v.memo || '',
      updatedAt: v.updatedAt || 0
    }))
    .sort((a, b) => a.month < b.month ? 1 : a.month > b.month ? -1 : 0);

let renderTimer = null;
function scheduleRender() {

/* 3칸 금액이 칸 밖으로 넘치지 않게 폰트를 한 단계씩 줄여 맞춘다 */
function fitAmounts(root) {
  const els = (root || document).querySelectorAll('[data-fit]');
  els.forEach(el => {
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize) || 12.5;
    let size = base, guard = 0;
    while (size > 8 && el.scrollWidth > el.clientWidth + .5 && guard++ < 40) {
      size = Math.round((size - .5) * 100) / 100;
      el.style.fontSize = size + 'px';
    }
  });
}
/* 목표 카드 1·2·3번 '현재' 뱃지의 폭을 가장 넓은 뱃지에 맞춰 세로로 반듯하게 통일한다 */
function fitGoalBadges(root) {
  const pills = Array.from((root || document).querySelectorAll('.goalcard .nwpill'));
  if (pills.length < 2) return;
  pills.forEach(p => { p.style.minWidth = '0px'; });
  const widest = Math.max.apply(null, pills.map(p => p.getBoundingClientRect().width));
  if (!widest) return;
  const w = Math.ceil(widest) + 'px';
  pills.forEach(p => { p.style.minWidth = w; });
}
function render() {
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ST.tab));
  const view = $('#view');
  const keep = view.scrollTop;
  if (!ST.loaded) {
    view.innerHTML = '<div class="skeleton">불러오는 중…</div>';
    return;
  }
  if (ST.tab === 'vision') { view.innerHTML = visionView(); fitGoalBadges(view); }
  else if (ST.tab === 'networth') { view.innerHTML = netWorthView(); fitAmounts(view); }
  else if (ST.tab === 'goals') view.innerHTML = goalsView();
  else if (ST.tab === 'bucket') view.innerHTML = bucketView();
  else if (ST.tab === 'plan') view.innerHTML = planView();
  else view.innerHTML = tradeView();
  if (render.sameTab) view.scrollTop = keep;
  render.sameTab = true;
}
function go(tab) {
  if (ST.tab === tab) return;
  ST.tab = tab;
  render.sameTab = false;
  render();
  $('#view').scrollTop = 0;
  tabIntoView(tab);
}
function tabIntoView(tab) {
  const b = $('#tabs .tab[data-tab="' + (tab || ST.tab) + '"]');
  if (!b) return;
  try { b.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {}

/* ---------- 🔄 갈아타기 전략 (비전 탭 · 편집 가능) ---------- */
function flowData() {
  const f = ST.vision && ST.vision.roadmapFlow;
  return (f && typeof f === 'object') ? f : null;
}
/* 2번째 '입주권(분양권)' 단계는 카드에서 뺐다(2026-11-17 요청).
   방 데이터는 그대로 두고 화면에서만 감춘 뒤, 남은 호기 배지를 1호기부터 다시 매긴다. */
function isDroppedFlowStep(s) {
  return String((s && s.label) || '').replace(/\s+/g, '').indexOf('입주권(분양권)') >= 0;
}
function flowSteps() {
  const f = flowData();
  const all = (f && Array.isArray(f.steps)) ? f.steps.filter(x => x && typeof x === 'object') : [];
  let n = 0;
  return all.filter(s => !isDroppedFlowStep(s)).map(s => {
    const badge = String(s.badge || '');
    if (/^\d+호기$/.test(badge)) { n += 1; return { ...s, badge: n + '호기' }; }
    return s;
  });
}
function flowWays() {
  const f = flowData();
  return (f && Array.isArray(f.ways)) ? f.ways.filter(x => x && typeof x === 'object') : [];
}
function flowSection() {
  const f = flowData();
  const head = '<div class="card-h"><h2>🔄 갈아타기</h2><div class="board-tools">' +

/* ---------- 3. 하고 싶은 일 (버킷) ---------- */
const BK_GROUPS = [
  { id: 'g1', name: '핵심 자산 · 라이프' },
  { id: 'g2', name: '일 · 커리어 · 현금흐름' },
  { id: 'g3', name: '나 · 부부의 삶 · 경험' },
  { id: 'g4', name: '가족' },
  { id: 'g5', name: '지인' }
];
function bkGroups() {
  const gs = (ST.bucket && typeof ST.bucket === 'object' && ST.bucket.groups) || {};
  return BK_GROUPS.map((g, i) => {
    const d = (gs[g.id] && typeof gs[g.id] === 'object') ? gs[g.id] : {};
    const o = num(d.order);
    return { id: g.id, name: d.name || g.name, order: o === null ? i + 1 : o };
  }).sort((a, b) => a.order - b.order);
}
function bkItems() {
  const it = (ST.bucket && typeof ST.bucket === 'object') ? ST.bucket.items : null;
  return entries(it).map(([id, v]) => ({ id, ...v }));
}
function bkSorted() {
  const order = {};
  bkGroups().forEach((g, i) => { order[g.id] = i; });
  return bkItems().sort((a, b) => {
    const ga = order[a.group] === undefined ? 99 : order[a.group];
    const gb = order[b.group] === undefined ? 99 : order[b.group];
    const na = num(a.order), nb = num(b.order);
    return (ga - gb) ||
      ((na === null ? 999 : na) - (nb === null ? 999 : nb)) ||
      String(a.text || '').localeCompare(String(b.text || ''));
  });
}
function bkRow(it) {
  return '<div class="bk">' +
    '<button class="bkbtn" data-act="bk-edit" data-id="' + esc(it.id) + '">' +
      '<span class="bke">' + esc(it.emoji || '✨') + '</span>' +
      '<span class="bkt">' + esc(it.text || '') +
        (it.note ? '<span class="bkn">' + esc(it.note) + '</span>' : '') +
      '</span>' +
      '<span class="bkchev">›</span>' +
    '</button></div>';
}
function bucketView() {
  const list = bkSorted();
  const head = '<section class="card">' +
    '<div class="card-h"><h2>✨ 돈 벌면 하고 싶은 일</h2><span class="pill">' + list.length + '개</span></div>' +
    '<p class="cap" style="text-align:left">하고 싶은 일을 모아 두세요 · 항목을 누르면 이모지·문구·메모를 고칠 수 있어요</p>' +
    '</section>';
  if (!list.length) {
    return head + '<section class="card"><p class="empty">아직 항목이 없어요<br>첫 항목을 추가해 보세요 🌼</p>' +
      '<button class="add-row" data-act="bk-add" data-group="g1">＋ 항목 추가</button></section>';
  }
  const groups = bkGroups();
  const known = {};
  groups.forEach(g => { known[g.id] = true; });
  const cards = groups.map(g => {
    const its = list.filter(x => x.group === g.id);
    return '<section class="card">' +
      '<div class="card-h"><h2>' + esc(g.name) + '</h2><div class="board-tools">' +
        (its.length ? '<span class="pill">' + its.length + '개</span>' : '') + '</div></div>' +
      (its.length ? '<div class="bks">' + its.map(bkRow).join('') + '</div>' : '<p class="empty">아직 항목이 없어요</p>') +
      '<button class="add-row" data-act="bk-add" data-group="' + g.id + '">＋ 항목 추가</button>' +
      '</section>';
  }).join('');
  const etc = list.filter(x => !known[x.group]);
  const etcCard = etc.length
    ? '<section class="card"><div class="card-h"><h2>기타</h2><span class="pill">' + etc.length + '</span></div>' +
      '<div class="bks">' + etc.map(bkRow).join('') + '</div></section>'
    : '';
  return head + cards + etcCard;
}

function tradeList() {
  return entries(ST.tradeUp).map(([id, v]) => ({ id, ...v })).sort((a, b) => {
    const da = String(a.date || ''), db = String(b.date || '');
    if (da !== db) return da < db ? 1 : -1;
    const oa = num(a.order), ob = num(b.order);
    return (oa === null ? 999 : oa) - (ob === null ? 999 : ob) || a.id.localeCompare(b.id);
  });
}

$('#view').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act],[data-go]');
  if (!el) return;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const act = el.dataset.act;
  if (act === 'v-ms') return openVisionMsSheet(el.dataset.i);
  if (act === 'v-ms-cell') return openVisionMsSheet(el.dataset.i, el.dataset.b);
  if (act === 'v-flow-step') return openFlowStepSheet(el.dataset.i);
  if (act === 'v-flow-way') return openFlowWaySheet(el.dataset.i);
  if (act === 'v-flow-meta') return openFlowMetaSheet();
  if (act === 'v-flow-init') return createRoadFlow();
  if (act === 'bk-add') return openBkSheet(null, el.dataset.group);
  if (act === 'bk-edit') return openBkSheet(el.dataset.id);
  if (act === 'tt-add') return openTradeSheet(null);
  if (act === 'tt-edit') return openTradeSheet(el.dataset.id);
  if (act === 'nw-add') return openNwSheet(thisMonth());
  if (act === 'nw-edit') return openNwSheet(el.dataset.month);
  if (act === 'g-toggle') {
    const kind = el.dataset.kind, id = el.dataset.id;
    const cur = ST[kind][id]; if (!cur) return;
    const next = !cur.done;
    ST[kind][id] = { ...cur, done: next, doneAt: next ? Date.now() : null };
    render.sameTab = true; render();
    try { await patch(kind + '/' + id, { done: next, doneAt: next ? Date.now() : null }); }
    catch (err) { ST[kind][id] = cur; render.sameTab = true; render(); toast('저장하지 못했어요'); }
    return;
  }
  if (act === 'g-edit') return openGoalSheet(el.dataset.kind, el.dataset.id);
  if (act === 'pl-item') return openPlanItemSheet(el.dataset.c, el.dataset.s, el.dataset.i);
  if (act === 'pl-add') return openPlanItemSheet(el.dataset.c, el.dataset.s, null);
  if (act === 'pl-ch') return openPlanChapterSheet(el.dataset.c);
});

/* ---------- 순자산 입력 시트 ---------- */
function nwUnitsInit(man) {
  const u = { seeun: 'man', chankyu: 'man' };
  return u;
}
function fromMan(man, unit) {
  if (man === null || man === undefined || man === '') return '';
  const v = unit === 'eok' ? man / 10000 : man;
  return String(Math.round(v * 10000) / 10000);
}
function toMan(val, unit) {
  const n = Number(val);
  if (!Number.isFinite(n)) return null;
  return unit === 'eok' ? Math.round(n * 10000) : Math.round(n);
}
function openNwSheet(month) {
  const cur = ST.netWorth[month] || null;
  draft.nw = {
    month: month || thisMonth(),
    seeun: cur ? num(cur.seeun) ?? 0 : null,
    chankyu: cur ? num(cur.chankyu) ?? 0 : null,
    expense: cur ? num(cur.expense) ?? 0 : null,
    memo: cur ? (cur.memo || '') : '',
    unit: { seeun: 'man', chankyu: 'man', expense: 'man' },
    editing: !!cur
  };
  const d = draft.nw;
  const [curY, curM] = d.month.split('-');
  const nowY = new Date().getFullYear();
  const years = [];
  for (let y = Math.min(nowY - 3, Number(curY) || nowY); y <= Math.max(nowY + 6, Number(curY) || nowY); y++) years.push(y);
  const body =
    '<div class="fld"><span>년-월</span><div class="ym-row">' +
      '<span class="sel"><select class="inp" id="nwYear">' + years.map(y =>
        '<option value="' + y + '"' + (String(y) === curY ? ' selected' : '') + '>' + y + '년</option>').join('') + '</select><i>▾</i></span>' +
      '<span class="sel"><select class="inp" id="nwMon">' + Array.from({ length: 12 }, (_, i) => i + 1).map(m =>
        '<option value="' + String(m).padStart(2, '0') + '"' +
        (String(m).padStart(2, '0') === curM ? ' selected' : '') + '>' + m + '월</option>').join('') + '</select><i>▾</i></span>' +
    '</div></div>' +
    '<div class="fld"><span>세은 순자산</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwSeeun" placeholder="0" value="' + esc(fromMan(d.seeun, 'man')) + '">' +
      '<div class="unit-seg" data-who="seeun"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="fld"><span>찬규 순자산</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwChankyu" placeholder="0" value="' + esc(fromMan(d.chankyu, 'man')) + '">' +
      '<div class="unit-seg" data-who="chankyu"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="fld"><span>부부 총비용</span><div class="unit-row">' +
      '<input class="inp" type="number" inputmode="decimal" id="nwCost" placeholder="0" value="' + esc(fromMan(d.expense, 'man')) + '">' +
      '<div class="unit-seg" data-who="expense"><button data-u="man" class="on">만원</button><button data-u="eok">억원</button></div>' +
    '</div></div>' +
    '<div class="sum-preview net"><span class="k">부부 순자산</span><span class="v" id="nwNet">—</span></div>' +
    '<label class="fld"><span>메모 (선택)</span><textarea class="inp" id="nwMemo" placeholder="예: 예금·주식·부동산 합계">' + esc(d.memo) + '</textarea></label>' +
    '<p class="cap" style="text-align:left">부부 순자산 = 세은 + 찬규 − 부부 총비용. 대출·부채를 뺀 순수 자산으로 적어 주세요. 만원 단위로 저장돼요.</p>';

  const acts = '<button class="sh-save" id="nwSave">' + (d.editing ? '수정 저장' : '저장') + '</button>' +
    (d.editing ? '<button class="sh-del" id="nwDel">삭제</button>' : '');

  openSheet(d.editing ? '순자산 수정' : '이번 달 순자산 입력', body, acts);

  const upd = () => {
    const s = toMan($('#nwSeeun').value, d.unit.seeun);
    const c = toMan($('#nwChankyu').value, d.unit.chankyu);
    const e = toMan($('#nwCost').value, d.unit.expense);
    const gross = (s === null ? 0 : s) + (c === null ? 0 : c);
    const net = gross - (e === null ? 0 : e);
    $('#nwNet').textContent = (s === null && c === null && e === null) ? '—' : fmtMan(net);
  };
  upd();
  const syncMonth = () => { d.month = $('#nwYear').value + '-' + $('#nwMon').value; };
  $('#nwYear').addEventListener('change', syncMonth);
  $('#nwMon').addEventListener('change', syncMonth);
  $('#nwSeeun').addEventListener('input', upd);
  $('#nwChankyu').addEventListener('input', upd);
  $('#nwCost').addEventListener('input', upd);
  $$('.unit-seg', $('#shBody')).forEach(seg => {
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('[data-u]'); if (!b) return;
      const who = seg.dataset.who;
      if (d.unit[who] === b.dataset.u) return;
      const input = who === 'seeun' ? $('#nwSeeun') : who === 'chankyu' ? $('#nwChankyu') : $('#nwCost');
      const man = toMan(input.value, d.unit[who]);
      d.unit[who] = b.dataset.u;
      input.value = fromMan(man, d.unit[who]);
      $$('button', seg).forEach(x => x.classList.toggle('on', x.dataset.u === d.unit[who]));
      upd();
    });
  });

  let delArmed = false;
  if (d.editing) {
    $('#nwDel').addEventListener('click', async (e) => {
      if (!delArmed) {
        delArmed = true;
        e.target.classList.add('confirm');
        e.target.textContent = '정말 삭제할까요?';
        return;
      }
      const target = draft.nw.month;
      try {
        await del('netWorth/' + target);
        delete ST.netWorth[target];
        closeSheet(); render.sameTab = true; render(); toast('삭제했어요');
      } catch (err) { toast('삭제하지 못했어요'); }
    });
  }

/* ============================================================

function intOrNull(s) {
  const t = String(s == null ? '' : s).trim();
  if (!t) return null;
  const n = Number(t.replace(/[^0-9.-]/g, ''));
  return Number.isFinite(n) ? Math.round(n) : null;
}
function delArm(btn) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.armed = '1';
  btn.classList.add('confirm');
  btn.textContent = '정말 삭제할까요?';
  return false;
}
async function saveVisionKey(key, val, okMsg) {
  const prev = ST.vision;
  const next = { ...(prev || {}) };
  if (val === null) delete next[key]; else next[key] = val;
  ST.vision = next;
  closeSheet();
  render.sameTab = true; render();
  try { await put('vision/' + key, val); toast(okMsg); }
  catch (e) { ST.vision = prev; render.sameTab = true; render(); toast('저장하지 못했어요'); }
}

/* 화면에 보이는 전문성 영역 — 방 데이터(rooms/…)는 건드리지 않고
   화면에서만 최신 구성으로 맞춘다: 재개발·재건축은 🏗️ 재재 한 칸으로 묶고,
   마지막 칸에 📜 정책을 붙인다(이미 있으면 중복해서 붙이지 않는다). */
const EXP_EMOJI_MERGE = '🏗️';
function expertiseItems() {
  const raw = vArr(ST.vision, 'expertise').filter(x => x && (x.label || x.emoji));
  const out = [];
  let merged = false;
  raw.forEach(x => {
    const label = String(x.label || '').trim();
    if (!label) return;
    if (/재재|재개발|재건축/.test(label)) {
      if (!merged) {
        out.push({ emoji: EXP_EMOJI_MERGE, label: '재재' });
        merged = true;
      }
      return;
    }
    if (/정책/.test(label)) return; /* 정책은 항상 마지막 칸으로 내려 붙인다 */
    out.push({ emoji: x.emoji, label: label });
  });
  if (!out.length) return out;
  out.push({ emoji: '📜', label: '정책' });
  return out;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function newKey(prefix) {
  return (prefix || 'k') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function bkSet(id, rec) {
  if (!ST.bucket || typeof ST.bucket !== 'object') ST.bucket = {};

}
function bkDel(id) {
  if (ST.bucket && ST.bucket.items) delete ST.bucket.items[id];
}
function nextBkOrder(group) {
  let max = 0;
  bkItems().forEach(x => {
    if (x.group === group) { const n = num(x.order); if (n !== null && n > max) max = n; }
  });
  return max + 1;
}

/* ============================================================
   📘 플랜 (masterPlan)
   카드 내용도 전부 Firebase 방에서만 온다. 정적 코드에는 없다.
   ============================================================ */
function planRoot() {
  if (!ST.plan || typeof ST.plan !== 'object') ST.plan = {};
  if (!ST.plan.chapters || typeof ST.plan.chapters !== 'object') ST.plan.chapters = {};
  return ST.plan.chapters;
}
function plOrder(v, d) { const n = num(v); return n === null ? d : n; }
function planChapters() {
  const ch = planRoot();
  return entries(ch).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planSections(ch) {
  const s = (ch && ch.sections && typeof ch.sections === 'object') ? ch.sections : {};
  return entries(s).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planItems(sec) {
  const it = (sec && sec.items && typeof sec.items === 'object') ? sec.items : {};
  return entries(it).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (plOrder(a.order, 999) - plOrder(b.order, 999)) || a.id.localeCompare(b.id));
}
function planCount() {
  let n = 0;
  planChapters().forEach(ch => planSections(ch).forEach(sec => { n += planItems(sec).length; }));
  return n;
}
function planItemRow(cid, sid, it) {
  const badge = it.draft ? '<span class="bdraft">구상</span>' : '';
  const head = (it.label || it.draft)
    ? '<span class="lb">' + (it.label ? esc(it.label) : '') + badge + '</span>' : '';
  return '<button class="pl-item' + (it.draft ? ' draft' : '') + '" data-act="pl-item" data-c="' + esc(cid) +
    '" data-s="' + esc(sid) + '" data-i="' + esc(it.id) + '">' +
    '<span class="plb">' + head +
      '<span class="vv">' + esc(it.value || '') + '</span>' +
      (it.note ? '<span class="nt">' + esc(it.note) + '</span>' : '') +
    '</span><span class="chev">›</span></button>';
}
function planView() {
  const chs = planChapters();
  const top = '<section class="card">' +
    '<div class="card-h"><h2>📘 부부데이지 마스터 플랜</h2>' +
      (chs.length ? '<span class="pill navy">' + chs.length + '장</span>' : '') + '</div>' +
    (chs.length
      ? '<p class="pl-intro">브랜드 · 콘텐츠 · 채널 · 사업 구상 · 확정 전 항목을 한 장씩 모았어요. 항목을 눌러 바로 고칠 수 있어요.</p>' +
        '<div class="pl-count"><span class="pill">' + planCount() + '개 항목</span>' +
        '<span class="pill">확정 전은 구상 표시</span></div>'
      : '<p class="empty">플랜 데이터를 기다리고 있어요</p>') +
    '</section>';
  if (!chs.length) return top;
  const cards = chs.map(ch => {
    const secs = planSections(ch);
    const body = secs.length ? '<div class="pl-secs">' + secs.map(sec => {
      const its = planItems(sec);
      return '<div class="pl-sec">' +
        (sec.name ? '<div class="pl-sec-h">' + esc(sec.name) + '</div>' : '') +
        its.map(it => planItemRow(ch.id, sec.id, it)).join('') +
        '<button class="add-row" data-act="pl-add" data-c="' + esc(ch.id) + '" data-s="' + esc(sec.id) + '">＋ 항목 추가</button>' +

    return '<section class="card">' +
      '<div class="card-h"><h2>' + (ch.emoji ? esc(ch.emoji) + ' ' : '') + esc(ch.title || '플랜') + '</h2>' +
        '<button class="pen-btn" data-act="pl-ch" data-c="' + esc(ch.id) + '" aria-label="챕터 수정">✏️</button></div>' +
      (ch.intro ? '<p class="pl-intro">' + esc(ch.intro) + '</p>' : '') +
      body +
      '</section>';
  }).join('');
  return top + cards + '<p class="foot-note">항목을 누르면 고칠 수 있어요 · 아직 확정 전인 내용은 <b>구상</b>으로 표시돼요</p>';

      '<input class="inp" id="plxTitle" value="' + esc(ch.title || '') + '" placeholder="챕터 제목">' +
    '</div></div>' +
    '<label class="fld"><span>맨 위 설명 (선택)</span>' +
      '<textarea class="inp" id="plxIntro" style="min-height:88px">' + esc(ch.intro || '') + '</textarea></label>' +
    '<p class="hint-in">항목은 각 섹션 아래 「＋ 항목 추가」로 더하고, 항목을 누르면 고칠 수 있어요.</p>';
  openSheet('챕터 수정', body, '<button class="sh-save" id="plxSave">저장</button>');
  $('#plxSave').addEventListener('click', async () => {
    const title = $('#plxTitle').value.trim();
    if (!title) { toast('제목을 적어 주세요'); return; }
    const emoji = $('#plxEmoji').value.trim();
    const intro = $('#plxIntro').value.trim();
    const prev = JSON.parse(JSON.stringify(ST.plan || {}));
    const base = { ...ch };
    ch.emoji = emoji || null; ch.title = title; ch.intro = intro || null; ch.updatedAt = Date.now();
    closeSheet(); render.sameTab = true; render();
    try {
      await patch('masterPlan/chapters/' + cid, { emoji: emoji || null, title: title, intro: intro || null, updatedAt: Date.now() });
      toast('챕터를 저장했어요');
    } catch (e) {
      ST.plan.chapters[cid] = base; render.sameTab = true; render(); toast('저장하지 못했어요');
    }
  });
}

/* ============================================================
   📝 수정 요청 메모 (이 기기에만 저장 · 탭 이동해도 유지)
   ============================================================ */
const MEMO_KEY = 'bubudaisy.memos';
const TAB_NAMES = {
  vision: '비전', networth: '순자산', goals: '목표',
  bucket: '하고싶은일', trade: '갈아타기', plan: '플랜'
};
let MEMOS = loadMemos();
function loadMemos() {
  try {
    const a = JSON.parse(localStorage.getItem(MEMO_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => x && x.text) : [];
  } catch (e) { return []; }
}
function saveMemos() {
  try { localStorage.setItem(MEMO_KEY, JSON.stringify(MEMOS)); } catch (e) {}
  paintMemoBadge();
}
function memoTabName(t) { return TAB_NAMES[t] || '기타'; }
function paintMemoBadge() {
  const b = $('#memoBtn'), c = $('#memoCnt');
  if (!b || !c) return;
  const n = MEMOS.length;
  b.classList.toggle('has', n > 0);
  c.textContent = n > 9 ? '9+' : String(n);
  c.classList.toggle('hidden', n === 0);
  b.setAttribute('aria-label', n ? '수정 요청 메모 ' + n + '개' : '수정 요청 메모');
}
function memoRows() {
  if (!MEMOS.length) return '<p class="empty">아직 적어 둔 요청이 없어요<br>고치고 싶은 곳을 그때그때 적어 두세요 🌼</p>';
  return MEMOS.map(m =>
    '<div class="memo-row"><span class="mt">' + esc(m.tab || '기타') + '</span>' +
    '<span class="mx">' + esc(m.text) + '</span>' +
    '<button class="memo-del" data-mdel="' + esc(m.id) + '" aria-label="삭제">✕</button></div>').join('');
}
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (!ok) throw new Error('copy failed');
}
function openMemoSheet() {
  const body =
    '<div class="fld"><span>요청 내용 · 지금 탭 [' + esc(memoTabName(ST.tab)) + ']</span>' +
      '<textarea class="inp" id="memoText" style="min-height:78px" placeholder="예: 플랜 탭 항목 글자가 조금 작아요"></textarea></div>' +
    '<button class="add-row" id="memoAdd">＋ 메모 추가</button>' +
    '<div class="memo-list" id="memoList">' + memoRows() + '</div>' +
    '<p class="hint-in">탭 이름이 앞에 자동으로 붙어요. 메모는 이 기기에만 저장되고, 탭을 옮겨도 그대로 남아요.</p>';
  const acts =
    '<button class="sh-save" id="memoCopy">📋 전체 복사</button>' +
    '<button class="sh-del" id="memoClear">🗑 목록 비우기</button>';
  openSheet('📝 두두에게 보낼 수정 요청', body, acts);

  const inp = $('#memoText');
  const addMemo = () => {
    const v = inp.value.trim();
    if (!v) { toast('요청 내용을 적어 주세요'); inp.focus(); return; }
    MEMOS.push({ id: newKey('m'), tab: memoTabName(ST.tab), text: v, at: Date.now() });
    saveMemos();
    inp.value = '';
    $('#memoList').innerHTML = memoRows();
    toast('메모를 추가했어요');
    inp.focus();
  };
  $('#memoAdd').addEventListener('click', addMemo);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMemo(); }
  });
  $('#memoList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mdel]');
    if (!b) return;
    MEMOS = MEMOS.filter(x => x.id !== b.dataset.mdel);
    saveMemos();
    $('#memoList').innerHTML = memoRows();
  });
  $('#memoCopy').addEventListener('click', async () => {
    if (!MEMOS.length) { toast('복사할 메모가 없어요'); return; }
    const text = 'BUBUDAISY 수정 요청:\n' +
      MEMOS.map(m => '- [' + (m.tab || '기타') + '] ' + m.text).join('\n');
    try { await copyText(text); toast('복사됐어요! 피클 채팅에 붙여넣어 주세요'); }
    catch (e) { toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요'); }
  });
  $('#memoClear').addEventListener('click', (e) => {
    if (!MEMOS.length) { toast('비울 메모가 없어요'); return; }
    const btn = e.currentTarget;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.classList.add('confirm');
      btn.textContent = '정말 비울까요?';
      return;
    }
    MEMOS = [];
    saveMemos();
    $('#memoList').innerHTML = memoRows();
    btn.dataset.armed = '';
    btn.classList.remove('confirm');
    btn.textContent = '🗑 목록 비우기';
    toast('메모를 모두 지웠어요');
  });
}
$('#memoBtn').addEventListener('click', openMemoSheet);
paintMemoBadge();

/* ============================================================
   시작
   ============================================================ */
function enter(room) {
  ROOM = room;
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  setLive('connecting');
  syncNow(true);
  connect();
  render.sameTab = false; render();
  window.addEventListener('online', () => { syncNow(true); if (!es) connect(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { syncNow(true); if (!es) connect(); }
  });
}
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.h === VERIFY_HEX && ROOM_KEY_RE.test(saved.room || '')) {
    enter(saved.room);
  } else {
    paintPins();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
